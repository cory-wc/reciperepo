steps:
- step: Cook onions and garlic in oil over medium heat until softened.
- step: Add remaining ingredients and bring to a boil. Reduce heat and simmer covered
    about 40–50 minutes or until barley is cooked.
- step: Remove bay leaf and serve.
notes:
- Soup may thicken upon cooling; add extra broth or water to reach desired consistency.
