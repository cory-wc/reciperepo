steps:
- step: In a large pan or pot begin heating your sesame oil over medium heat. Add
    in minced garlic and ginger and cook for a few minutes.
- step: Add in chili oil, miso paste, diced green onion. Stir and let cook for another
    minute. Miso paste will still be a little thick and will dissolve fully in broth.
- step: Add in potstickers and pan fry for 2-3 minutes on each side until they are
    slightly browned and coated in the garlic onion mixture.
- step: Add in vegetable broth, carrots, and spinach. Bring to boil for only 2 minutes
    then remove from heat. (DON'T OVERCOOK POTSTICKERS OR THEY WILL BECOME MUSHY).
- step: Top individual soup with more green onion, chili oil, and/or sesame seeds.
    You can also add more soy sauce if you like it saltier.
notes:
- The number of servings for this recipe depends how hungry you are! My husband and
  I together ate the whole thing but you may be able to have this as 4 servings depending
  on your appetite.
- Miso paste is often found in the refrigerated section of your grocery store and
  is usually found near tofu.
