recipe_uuid: wc-kitchen.blackened-mahi-mahi
recipe_name: Blackened Mahi Mahi
description: 'You can easily control the level of spiciness in blackened fish by making
  your own Cajun spice mix. This is a super fast, incredibly delicious way to add
  more seafood to your diet.

  '
author: Valerie Brunmeier
yields:
- amount: 4
  unit: servings
X-prep_time: 10 mins
X-cook_time: 8 mins
X-total_time: 18 mins
ingredients:
- mahi mahi:
    amounts:
    - amount: 4
      unit: fillets
    notes: approximately 6 ounces each
- butter:
    amounts:
    - amount: 2
      unit: tablespoon
- olive oil:
    amounts:
    - amount: 1
      unit: tablespoon
- lemon:
    amounts:
    - amount: 1
      unit: whole
- onion powder:
    amounts:
    - amount: 1.5
      unit: teaspoon
- garlic powder:
    amounts:
    - amount: 1
      unit: teaspoon
- smoked paprika:
    amounts:
    - amount: 1
      unit: teaspoon
- dried thyme:
    amounts:
    - amount: 1
      unit: teaspoon
- dried oregano:
    amounts:
    - amount: 1
      unit: teaspoon
- fine grain sea salt:
    amounts:
    - amount: 1
      unit: teaspoon
- freshly ground black pepper:
    amounts:
    - amount: 0.5
      unit: teaspoon
- cayenne pepper:
    amounts:
    - amount: 0.5
      unit: teaspoon
steps:
- step: Combine all Kickin' Cajun Seasoning Mix ingredients in a small bowl.
- step: 'Pat fillets dry with paper towels. Season the fillets liberally with Kickin''
    Cajun Spice Mix on both sides, pressing the seasoning into the fish with your
    hands. Wash hands thoroughly.

    '
- step: 'Place a large saute pan over medium-high heat and add butter and oil. When
    the fat is nice and hot, add the seasoned fish. Cook, undisturbed, for several
    minutes, until golden brown on one side. Flip fish over and continue to cook until
    opaque and completely cooked through.

    '
- step: Squeeze lemon juice over the fish and serve.
notes: 'If you''re cooking more than 4 fillets or would like to add a more generous
  amount of seasoning, follow my recipe to prepare a big batch of Kickin'' Cajun Seasoning
  Mix.

  '
