steps:
- step: In a large bowl, mix the breadcrumbs together with the milk, cream (if using),
    egg, garlic, salt, peppers and spice. Allow the milk to soak into the breadcrumbs
    for at least 10 minutes.
- step: Once the milk has absorbed some, add in the onion, meat(s) and parsley. Mix
    well with your hands to combine.
- step: Roll meat into about 24 small balls, or 15 larger balls.
- step: Heat 1 tablespoon of butter and 2 teaspoons of oil in a pan on medium-high
    heat. Fry meatballs in batches of two so they don't stew or simmer. Transfer to
    a warm plate and cover with foil.
- step: Add the 1/3 cup butter to the juices in the pan to melt. Whisk in the flour
    until it dissolves and turns brown in colour. Pour in the broth (or stock), cream,
    soy sauce and dijon. Bring to a simmer and season with salt and pepper to taste.
    Mix the sauce through well to combine all of the flavours together.
- step: Continue to simmer until thickened.
- step: 'To serve — Non Swedish way: Place meatballs into the gravy in the pan and
    serve. Traditional Swedish way: Do not make the cream sauce at all. Serve meatballs
    over plain or stewed macaroni, plain or mashed potatoes, and lingenberry jam (optional).'
