steps:
- step: Heat a skillet with 1 tsp sesame oil. Add the onion, garlic, and pork. Cook
    until pork is done and remove pork.
- step: Add 1 tsp oil to pan. Add onion, bell pepper, mushrooms, water chestnuts,
    and cabbage. Cook until vegetables start to soften.
- step: While vegetables cook, whisk together hoisin, water, ginger, vinegar, remaining
    1 tsp sesame oil, soy sauce, and pepper flakes.
- step: Add the pork and sauce to pan. Stir well to combine and cook on low for 5
    minutes.
- step: Serve with lettuce leaves.
