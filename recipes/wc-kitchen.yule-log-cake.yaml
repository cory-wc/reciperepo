steps:
- step: '(Partial — page 2 of recipe visible.) Heat the cream in the microwave just
    until it begins to boil. Pour it over the chocolate.

    '
- step: 'Allow the chocolate and cream to sit for a few minutes, then whisk until
    smooth. Let the ganache cool to about room temperature, then transfer to a large
    mixer bowl.

    '
- step: 'Whip on high speed until lightened in color and thick enough to spread.

    '
- step: 'To decorate the cake, use a large serrated knife to gently cut off a piece
    of the log about 3 inches in length. Make the cut with a slight diagonal.

    '
- step: 'Use some of the chocolate ganache to attach the small log to the side of
    the larger log. Make the cut with a slight diagonal.

    '
- step: 'Spread the remaining chocolate ganache all over the cake, then use a fork
    to create bark-like lines all over it.

    '
- step: 'Decorate with sugared cranberries and rosemary (instructions in notes), if
    desired. Refrigerate the cake until ready to serve.

    '
- step: '(Notes — sugared cranberries and rosemary): Add 1/2 cup of sugar and 1/2
    cup of water to a boil over medium-high heat. Reduce heat and simmer for 5 minutes
    until sugar has melted. Remove from heat and let cool for about 10 minutes. Spread
    1/2 cup of sugar evenly on a shallow dish. Dip cranberries and rosemary sprigs
    in the sugar water, then roll in the sugar. Let dry before adding to the cake.

    '
