recipe_uuid: wc-kitchen.the-best-apple-crisp
recipe_name: The Best Apple Crisp
description: This Apple Crisp recipe is the best fall dessert ever! Fresh sliced apples
  are topped with a buttery cinnamon oat topping that tastes divine with a scoop of
  vanilla ice cream!
source_url: https://belleofthekitchen.com/wprm_print/the_best_apple_crisp
source_authors:
- Ashlyn Edwards
yields:
- amount: 8
  unit: servings
ingredients:
- name_group: Filling
- apples:
    amounts:
    - amount: 5
      unit: cups
    notes: fresh
    processing:
    - sliced
- granulated sugar:
    amounts:
    - amount: 1/2
      unit: cups
- cinnamon (filling):
    amounts:
    - amount: 1/2
      unit: teaspoons
- vanilla extract:
    amounts:
    - amount: 1
      unit: teaspoons
- name_group: Topping
- all-purpose flour:
    amounts:
    - amount: 1/2
      unit: cups
- old-fashioned oats:
    amounts:
    - amount: 1/3
      unit: cups
- brown sugar:
    amounts:
    - amount: 2/3
      unit: cups
    notes: packed
- salt:
    amounts:
    - amount: 1/4
      unit: teaspoons
- cinnamon (topping):
    amounts:
    - amount: 1/2
      unit: teaspoons
- butter:
    amounts:
    - amount: 1/4
      unit: cups
    notes: 1/2 stick
    processing:
    - melted
steps:
- step: Preheat oven to 350°F. Grease a deep dish pie plate or large baking dish with
    butter or cooking spray and set aside.
- step: Combine the sliced apples with the sugar, cinnamon, and vanilla extract in
    a large bowl and mix until all of the apples are evenly coated. Pour into the
    prepared baking dish.
- step: In a separate medium size bowl, combine the flour, oats, brown sugar, salt,
    and cinnamon. Pour in the melted butter and stir until well coated and crumbly.
    Sprinkle the crumb mixture evenly over the top of the apples.
- step: Bake in the preheated oven for 45–60 minutes until fruit is soft and the topping
    is golden brown. Allow to cool slightly before serving. Serve warm with vanilla
    ice cream on top.
notes:
- Slice your apples evenly. Use a slicer to speed up the process and remove the core
  easily. Then slice the apples once more with a knife so the widest part of each
  slice is roughly 1/2 inch wide. Chopping into uniform chunks also works.
- If topping starts to brown too quickly before apples are done, loosely tent with
  aluminum foil and continue baking.
- Chopped nuts like pecans or walnuts make a delicious addition to the topping (omit
  if nut allergy).
- Serve with whipped cream and a drizzle of caramel sauce as an alternative to ice
  cream.
