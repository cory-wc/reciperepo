recipe_uuid: wc-kitchen.instant-pot-parmesan-risotto
recipe_name: Instant Pot Parmesan Risotto

yields:
  - amount: 6
    unit: servings

ingredients:
  - butter:
      amounts:
        - amount: 6
          unit: tablespoons

  - onion:
      amounts:
        - amount: 1
          unit: medium
      processing:
        - diced

  - garlic:
      amounts:
        - amount: 2
          unit: cloves
      processing:
        - minced

  - arborio rice:
      amounts:
        - amount: "2 1/4"
          unit: cups

  - chicken broth:
      amounts:
        - amount: 6
          unit: cups
      processing:
        - divided

  - grated parmesan:
      amounts:
        - amount: 4
          unit: tablespoons

  - salt:
      amounts:
        - amount: 1/2
          unit: teaspoon

  - black pepper:
      amounts:
        - amount: 1/4
          unit: teaspoon

  - parsley or green onions:
      amounts:
        - amount: 1/2
          unit: cup
      processing:
        - chopped
        - for garnish

steps:
  - step: Using the Saute setting, melt the butter and saute onions for 3-5 minutes.
  - step: Add garlic and rice. Saute for 1 additional minute.
  - step: Pour in 2 C of broth. Stir for 2-3 minutes until the broth is absorbed by the rice.
  - step: Add remaining broth, salt, and pepper. Close and lock the lid.
  - step: Using the Manual pressure cook setting, adjust the time to 10 minutes. After the timer beeps, allow the pressure to release naturally for 10 minutes, then release any additional pressure.
  - step: Stir in parmesan cheese.
  - step: Serve topped with parsley or green onions.

source_url: https://www.365daysofcrockpot.com
X-total_time: 45 minutes
X-notes: Serve with simple roasted veggies like cauliflower, broccoli, or sweet potatoes.
