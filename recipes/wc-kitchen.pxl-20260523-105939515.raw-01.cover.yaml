steps:
- step: Melt butter in dutch oven. Add scallions, bell pepper, and celery. Cook until
    soft.
- step: Stir in potatoes, 2 cups of corn, bay leaf, broth, and salt. Bring to a boil.
    Reduce heat and simmer 15 minutes.
- step: Puree the remaining 2 cups of corn with milk. Stir the puree into soup, along
    with black pepper. Simmer until soup begins to thicken (5-10 minutes).
