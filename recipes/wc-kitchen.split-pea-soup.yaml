recipe_uuid: wc-kitchen.split-pea-soup
recipe_name: Split Pea Soup (Instant Pot)
yields:
- amount: 8
  unit: servings
X-total_time: 50 minutes
ingredients:
- butter:
    amounts:
    - amount: 3
      unit: tbsp
- onion, diced:
    amounts:
    - amount: 1
      unit: whole
- celery ribs, diced:
    amounts:
    - amount: 2
      unit: ribs
- carrots, diced:
    amounts:
    - amount: 2-3
      unit: whole
    notes: 2 to 3 carrots
- ham bone or diced ham:
    amounts:
    - amount: 1
      unit: bone
    notes: 1 ham bone or 6 oz diced ham
- dry split peas:
    amounts:
    - amount: 1
      unit: lb
- chicken or veggie stock:
    amounts:
    - amount: 6
      unit: cup
- bay leaves:
    amounts:
    - amount: 2
      unit: whole
- salt:
    amounts: []
    notes: to taste
- pepper:
    amounts: []
    notes: to taste
steps:
- step: Using butter, sauté onion, celery, and carrots in the Instant Pot until soft.
    Season with salt and pepper.
- step: Add the split peas, stock, ham, and bay leaves.
- step: Cook on high pressure for 15 minutes.
- step: Allow pressure to release for 10–15 minutes.
- step: (For ham bone only) Remove the meat from the bone and add back into soup.
notes:
- To make in a slow cooker, cook on low for 8 hours or high for 4 hours.
