steps:
- step: In a large pot or pan over medium heat, sauté the chopped onion in the olive
    oil for 5 minutes, stirring frequently. Then add the garlic and ginger and cook
    1 more minute, until fragrant.
- step: Add the garam masala, turmeric and red pepper flakes to the pan and stir into
    the onion mixture. Add a few tablespoons of water if the mixture is too dry.
- step: Now add the dried lentils, canned tomatoes and their juices, coconut milk
    and vegetable broth to the pan. Stir well and turn the heat to high. Bring to
    a boil, then lower heat and simmer for about 15 minutes, until the lentils are
    cooked and soft. Stir occasionally.

notes:
- Serve with cooked brown or white rice and vegan naan.

