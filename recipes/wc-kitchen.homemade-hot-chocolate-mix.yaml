recipe_uuid: wc-kitchen.homemade-hot-chocolate-mix
recipe_name: Homemade Hot Chocolate Mix
source_url: https://www.berlyskitchen.com/homemade-hot-chocolate-mix/
yields:
- amount: 13
  unit: servings
ingredients:
- granulated sugar:
    amounts:
    - amount: 1
      unit: cup
- unsweetened cocoa powder:
    amounts:
    - amount: 0.667
      unit: cup
- kosher salt:
    amounts:
    - amount: 0.5
      unit: teaspoon
- ground cinnamon:
    amounts:
    - amount: 0.125
      unit: teaspoon
    notes: optional; handwritten annotation reads '3/8 tsp peppermint' — may indicate
      an optional substitution or addition
steps:
- step: Whisk the sugar, cocoa powder, salt, and cinnamon (if using) together in a
    small bowl.
- step: Transfer the mixture to a jar with a lid or another airtight container until
    ready to use. The mix will last about 3 months when properly stored.
- step: To make hot chocolate, add 1 tablespoon of mix to every 4 ounces of milk.
    For an 8 ounce mug, use 2 tablespoons of mix. Top with marshmallows, marshmallow
    crème, whipped cream, or chocolate sauce.
