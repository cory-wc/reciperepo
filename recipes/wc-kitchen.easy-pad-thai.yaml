steps:
- step: 'Do your prep. Soak the rice noodles in fairly hot water for 30-45 minutes.
    They will turn white but still be quite firm. You want them a little toothy. Not
    hard. Just toothy. Pliable. 85 percent of the way there. Start checking them after
    about 20 minutes. This is important.

    '
- step: 'While the noodles are soaking, do your prep. Chop your vegetables. Cut the
    chicken into 3/4 inch cubes. Peel your shrimp if using.

    '
