steps:
- step: Sift the almond flour and confectioners' sugar together in a large glass or
    metal mixing bowl. Use a spoon to help work any larger pieces through the sieve.
    Do not want to discard a lot of that because then you won't have enough dry ingredients
    in the batter.
- step: Slowly fold the beaten egg whites into the almond flour mixture in 3 separate
    additions, folding until combined before adding the next addition. After you add
    all of the egg whites, pay very close attention to the consistency of your macaron
    batter. Continue folding the batter (which deflates air) until it thins out into
    the consistency of honey. A helpful cue is the figure 8 test — drop the macaron
    batter off your spatula in the form of a figure 8. The figure 8 should take no
    more than 10 seconds to sink back into itself. If it takes less, your batter was
    overmixed and is too thin. If it takes longer, continue slowly folding the batter
    to deflate more air, then perform the figure 8 test again. Go very slow so you
    don't accidentally overmix.
- step: Spoon the macaron batter into a piping bag fitted with a medium round piping
    tip, such as Wilton 12, Wilton 1A, or even Ateco 806. The macaron batter is very
    drippy, so transferring to the piping bag can be messy.
- step: Holding the piping bag at a 90 degree angle over the baking sheet, pipe batter
    in 1.5–2 inch rounds about 1–2 inches apart on prepared baking sheets. Pipe little
    mounds. The piped macaron batter flattens out. Bang the pan a couple times on
    the counter to pop any air bubbles, then use a toothpick to pop any remaining
    air bubbles.
- step: Let the piped macarons sit out until they are dry and no longer tacky on top,
    usually 30–60 minutes. This allows the top to firm up and form a skin, which helps
    the macarons rise up and form their trademark ruffled "feet." Do not let them
    sit out longer than they need to because they could begin to deflate.
- step: Meanwhile, preheat the oven to 325°F (163°C).
- step: Bake for 13 minutes. As the macarons shells bake, they should form feet. To
    test for doneness, lightly touch the top of a macaron with a spoon or your finger
    (careful, it's hot). If the macaron seems wobbly, it's not done and needs another
    1–2 minutes. If it seems set, it's done. Basically, bake until the macarons don't
    move around when touched.
- step: Let the shells cool on the baking sheet for 15 minutes, then transfer to a
    cooling rack to continue cooling. The macaron shells may stick to the parchment
    paper/baking sheet if you try to remove them too early. If this is happening,
    let them cool on the baking sheet a little longer before removing.
- step: After cooling, the shells are ready to fill and sandwich together. Spread
    filling with a knife or pipe it using the same round tip used for the macaron
    batter.
- step: You can eat right away or, as some professionals prefer, cover and refrigerate
    them 12–24 hours so the macarons and flavors can mature. Bring to room temperature
    before serving.
- step: Cover leftover macarons and refrigerate for up to 5 days.
