X-notes:
- Cooled macaron shells and finished assembled macarons can be frozen for up to 1
  month. Thaw at room temperature before filling/serving.
- Using weights and a food scale is the best way to guarantee success with this recipe.
- Macaron filling ideas mentioned include chocolate buttercream, lemon curd, Nutella
  frosting, cream cheese frosting, champagne frosting, peanut butter frosting, and
  cooled salted caramel.
- Adapted from Les Petits Macarons and Mad About Macarons.
