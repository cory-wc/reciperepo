yields:
- amount: 1
  unit: 8.5x4.5 inch loaf
X-active_time: 10 mins
X-total_time: 1 hr 5 mins
ingredients:
- light brown sugar:
    amounts:
    - amount: 0.75
      unit: cup
    notes: 159g, packed; dark brown sugar may be substituted
- apple juice:
    amounts:
    - amount: 2
      unit: tablespoon
    notes: 28g; or orange juice, milk, water, or the liquid of your choice; or 2 tablespoons
      (43g) boiled cider
- vegetable oil:
    amounts:
    - amount: 0.5
      unit: cup
    notes: 99g; boiled cider listed as alternative above
- large eggs:
    amounts:
    - amount: 2
      unit: whole
- King Arthur Pure Vanilla Extract:
    amounts:
    - amount: 1
      unit: teaspoon
- baking powder:
    amounts:
    - amount: 0.25
      unit: teaspoon
- baking soda:
    amounts:
    - amount: 0.5
      unit: teaspoon
- table salt:
    amounts:
    - amount: 1
      unit: teaspoon
- cinnamon:
    amounts:
    - amount: 1.5
      unit: teaspoon
    notes: optional
- King Arthur Unbleached All-Purpose Flour:
    amounts:
    - amount: 1.75
      unit: cup
    notes: 210g
- zucchini:
    amounts:
    - amount: 2
      unit: cup
    notes: 242–300g, grated or shredded, somewhere between firmly and lightly packed
- chopped walnuts:
    amounts:
    - amount: 0.75
      unit: cup
    notes: 85g, toasted until golden; optional
- raisins or currants:
    amounts:
    - amount: 0.75
      unit: cup
    notes: 128g; golden raisins preferred; optional
