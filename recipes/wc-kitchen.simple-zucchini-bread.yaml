      unit: tablespoon
    notes: 28g, dark brown sugar may be substituted; for sprinkling on top; optional
steps:
- step: Preheat the oven to 350°F. Lightly grease an 8½" x 4½" loaf pan.
- step: In a medium-sized bowl, beat together the brown sugar, boiled cider or other
    liquid, vegetable oil, eggs, and vanilla until smooth.
- step: Whisk the baking powder, baking soda, salt, and cinnamon into the flour, then
    add the dry ingredients to the liquid ingredients in the bowl, stirring or beating
    gently until smooth.
- step: Stir in the zucchini, walnuts, and raisins or currants.
- step: Scoop the batter into the prepared pan, smoothing it if necessary. Sprinkle
    with brown sugar.
- step: Bake the bread for 55 to 65 minutes, until a toothpick inserted into the center
    comes out clean. The top (just under the crust) may seem a bit sticky, but so
    long as the toothpick doesn't reveal wet batter, it's done.
- step: Remove the bread from the oven, and cool it in the pan for 10 minutes. Turn
    it out of the pan onto a rack to cool completely. For best results, don't slice
    until it's cool.
- step: Store the bread at cool room temperature, well wrapped, for several days;
    freeze for longer storage.
X-tips:
- Shredded zucchini varies a lot in weight depending on the season, the freshness
  of the vegetable, the fineness of the shred, and how firmly you pack it into the
  cup. Measure your zucchini by volume in this recipe, not weight; don't fret if your
  weight doesn't match the weight in the recipe.
- To toast chopped walnuts, spread them in a single layer in a baking pan and toast
  in a preheated 350°F oven for about 8 minutes, or until they're golden brown and
  smell toasty.
