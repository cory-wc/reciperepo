steps:
- step: Preheat oven to 400°F.
- step: Boil potatoes. Drain. Mash with butter, egg, grated cheese, salt, and pepper
    to taste.
- step: While potatoes are boiling, brown meat and mushrooms together.
- step: Cook carrots, onions, celery, and garlic in fat from meat. When vegetables
    are soft, add tomato paste, rosemary, thyme, and several dashes of Worcestershire
    sauce.
- step: Deglaze pan with beer and reduce. Add the chicken stock. When thick, remove
    the filling and add to a casserole dish.
- step: Assemble by spreading potatoes on top of filling, making sure to seal the
    sides. Texture the top with a fork to help it crisp. Add a sprinkling of cheese
    over top.
- step: Bake 10-15 minutes until cheese is melted and top is crispy.
- step: Cool for 5 minutes before serving.
notes:
