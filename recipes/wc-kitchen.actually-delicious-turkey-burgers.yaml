steps:
- step: In a large bowl, mix ground turkey, seasoned bread crumbs, onion, egg whites,
    parsley, garlic, salt, and pepper.
- step: Form into 12 patties.
- step: Cook the patties in a medium skillet over medium heat, turning once, to an
    internal temperature of 180 degrees F (85 degrees C).
