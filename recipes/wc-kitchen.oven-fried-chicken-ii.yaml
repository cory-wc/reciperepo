recipe_uuid: wc-kitchen.oven-fried-chicken-ii
recipe_name: Oven Fried Chicken II
source_url: https://www.allrecipes.com
yields:
- amount: 10
  unit: servings
ingredients:
- chicken thighs:
    amounts:
    - amount: 12
      unit: whole
- eggs:
    amounts:
    - amount: 3
      unit: whole
- all-purpose flour:
    amounts:
    - amount: 1
      unit: cups
- Italian seasoned bread crumbs:
    amounts:
    - amount: 1
      unit: cups
- paprika:
    amounts:
    - amount: 1
      unit: teaspoons
- vegetable oil:
    amounts:
    - amount: 0.5
      unit: cups
steps:
- step: Preheat oven to 350°F (175°C).
- step: Place flour in a shallow plate or bowl and season with salt and pepper to
    taste. Put the bread crumbs in another shallow plate or bowl and beat the eggs
    in another bowl.
- step: Dredge the chicken piece by piece in the flour, then the egg, then the bread
    crumbs, until all pieces are coated. Pour the oil into a 9x13 inch baking dish.
    Add the chicken to the dish and sprinkle with paprika to taste. Bake in the preheated
    oven for 30 minutes, then turn pieces over and bake for another 30 minutes. Remove
    from oven and drain on paper towels. Enjoy!
