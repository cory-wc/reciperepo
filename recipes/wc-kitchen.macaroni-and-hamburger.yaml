recipe_uuid: wc-kitchen.macaroni-and-hamburger
recipe_name: Macaroni & Hamburger
yields:
- amount: 6
  unit: serving
ingredients:
- whole wheat macaroni:
    amounts:
    - amount: 2
      unit: cup
- olive oil:
    amounts:
    - amount: 1
      unit: tbsp
- ground beef:
    amounts:
    - amount: 1
      unit: lb
- onions, diced:
    amounts:
    - amount: 2
      unit: whole
- diced tomatoes:
    amounts:
    - amount: 2
      unit: can
- frozen corn, defrosted:
    amounts:
    - amount: 1
      unit: can
steps:
- step: Boil water and prepare macaroni.
- step: Heat oil in skillet. Add onion and cook until translucent.
- step: Add ground beef to skillet. Break up and cook beef.
- step: Mix tomatoes, corn, beef, and macaroni.
- step: Cook on low for 5-10 minutes.
