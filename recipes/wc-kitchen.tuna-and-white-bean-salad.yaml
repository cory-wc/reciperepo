recipe_name: Tuna-and-White-Bean Salad
source_url: null
X-original-source: ../originals/PXL_20260523_110101482.RAW-01.COVER.JPG
X-source-publication: Food & Wine
X-source-author: Food & Wine Editors
X-source-updated: May 31, 2017
description: 'Purists would insist on imported Italian canned tuna fish for the Tuscan
  classic, but we think plain old tuna from the supermarket is just fine, too. However,
  make sure the fish is packed in oil; not only will the tuna be infinitely more flavorful,
  we use the oil as part of the dressing.

  '
ingredients:
- tuna packed in oil:
    amounts:
    - amount: 2
      unit: 6-ounce cans
    notes: packed in oil
- canned white beans:
    amounts:
    - amount: 3
      unit: cup
    notes: drained and rinsed, preferably cannellini (from two 15-ounce cans)
- red onion:
    amounts:
    - amount: 1
      unit: whole
    notes: sliced thin
- capers:
    amounts:
    - amount: 1
      unit: tablespoon
    notes: drained
- watercress:
    amounts:
    - amount: 2
      unit: bunch
    notes: about 3/4 pound, tough stems removed and leaves chopped (about 2 quarts)
- olive oil:
    amounts:
    - amount: 2
      unit: tablespoon
- red- or white-wine vinegar:
    amounts:
    - amount: 1
      unit: tablespoon
- salt:
    amounts:
    - amount: 0.75
      unit: teaspoon
- fresh-ground black pepper:
    amounts:
    - amount: 1
      unit: teaspoon
steps:
- step: 'Put the tuna with its oil, the beans, onion, capers, watercress, olive oil,
    vinegar, salt, and pepper in a large bowl. Toss gently to combine.

    '
notes:
- 'Since there are so few ingredients in this simple salad, you''ll want to use really
  good canned beans; lower-quality beans are mushy. Among the many fine brands, we
  find Goya to be consistently reliable.

  '
- 'If your tuna has less than one-and-a-half tablespoons of oil per can, add a little
  extra olive oil to make up the difference. We''re counting on that much oil as part
  of the dressing.

  '
- 'Variation: Use arugula instead of the watercress.'
- 'Variation: Try canned sardines instead of the tuna.'
- 'Suggested Pairing: Vernaccia di San Gimignano, from the vineyards surrounding the
  oft-pictured hilltop town of San Gimignano, is a refreshing and racy wine. Its subtle
  almond flavors will blend well with the earthiness of the beans.

  '
