recipe_name: Quick & Easy Red Lentil Dahl
description: Ready in 30 minutes or less, this Indian Red Lentil Dahl is easy to make
  and full of flavor. Serve with rice and vegan naan for an incredible feast!
source_url: https://www.noracooks.com/wprm_print/9546
