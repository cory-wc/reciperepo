recipe_uuid: wc-kitchen.corn-quesadillas
recipe_name: Corn Quesadillas
source_url: https://www.tasteofhome.com
yields:
- amount: 4
  unit: servings
ingredients:
- shredded cheese:
    amounts:
    - amount: 1 1/3
      unit: cups
    processing:
    - monterey jack or pepper jack recommended
- frozen corn:
    amounts:
    - amount: 1
      unit: cup
- green onions:
    amounts:
    - amount: 3
      unit: green onions
    processing:
    - thinly sliced
- fresh cilantro:
    amounts:
    - amount: 1/4
      unit: cup
    processing:
    - chopped
- sour cream:
    amounts:
    - amount: 2
      unit: tablespoons
- chipotle in adobo sauce:
    amounts:
    - amount: 1
      unit: tablespoon
    processing:
    - minced
- flour tortillas:
    amounts:
    - amount: 4
      unit: tortillas (8 inch)
- oil:
    amounts:
    - amount: 1
      unit: teaspoon
steps:
- step: Mix the cheese, corn, green onions, cilantro, sour cream, and chipotle in
    adobo in a large bowl.
- step: Lightly brush two tortillas with oil. Turn over and top with cheese mixture
    and remaining tortillas. Brush tops with remaining oil.
- step: Cook quesadillas 1-2 minutes on each side on a skillet over medium-high heat.
- step: Cut each quesadilla into six wedges. Serve with guacamole and sour cream.
notes:
- Serve with guacamole, sour cream, and warmed refried beans.
