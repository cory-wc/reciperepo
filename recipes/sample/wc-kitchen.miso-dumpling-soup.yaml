recipe_uuid: wc-kitchen.miso-dumpling-soup
recipe_name: Miso Dumpling Soup (15 Minutes)
description: Chewy vegetable dumplings in a warm, savory miso broth
source_authors:
- Allie Petersen
yields:
- amount: 4
  unit: servings
ingredients:
- frozen vegetable dumplings (potstickers):
    amounts:
    - amount: 1.33
      unit: pounds
    notes: vegetable brand; used Trader Joe's brand
- sesame oil:
    amounts:
    - amount: 2.67
      unit: tablespoons
- garlic:
    amounts:
    - amount: 5.33
      unit: cloves
    processing:
    - minced
- ginger:
    amounts:
    - amount: 2.67
      unit: teaspoons
    processing:
    - minced
- white miso paste:
    amounts:
    - amount: 1.33
      unit: tablespoons
    notes: low sodium; plus more for topping
- chili oil:
    amounts:
    - amount: 1.33
      unit: teaspoons
- green onion:
    amounts:
    - amount: 0.44
      unit: cups
    notes: plus more for topping
    processing:
    - diced
- vegetable broth:
    amounts:
    - amount: 5.33
      unit: cups
    notes: low sodium
- carrots:
    amounts:
    - amount: 1.33
      unit: cups
    processing:
    - julienned
- spinach:
    amounts:
    - amount: 1
      unit: large handful
steps:
- step: In a large pan or pot begin heating your sesame oil over medium heat. Add
    in minced garlic and ginger and cook for a few minutes.
- step: Add in chili oil, miso paste, diced green onion. Stir and let cook for another
    minute. Miso paste will still be a little thick and will dissolve fully in broth.
- step: Add in potstickers and pan fry for 2-3 minutes on each side until they are
    slightly browned and coated in the garlic onion mixture.
- step: Add in vegetable broth, carrots, and spinach. Bring to boil for only 2 minutes
    then remove from heat. (DON'T OVERCOOK POTSTICKERS OR THEY WILL BECOME MUSHY).
- step: Top individual soup with more green onion, chili oil, and/or sesame seeds.
    You can also add more soy sauce if you like it saltier.
notes:
- The number of servings depends on appetite; the recipe may serve 2–4.
- Miso paste is often found in the refrigerated section near tofu.
- Optional toppings: more green onion, chili oil, sesame seeds, soy sauce (if you
    want it saltier).
