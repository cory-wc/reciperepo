recipe_uuid: wc-kitchen.mexican-street-corn-salad
recipe_name: Mexican Street Corn Salad
description: 'This Mexican Street Corn Salad, also known as Esquites, is smoky, spicy,
  tangy and incredibly delicious. If you love the Mexican corn on the cob then you
  will love this version.

  '
source_authors:
- Joanna Cismaru
yields:
- amount: 4
  unit: servings
ingredients:
- corn:
    amounts:
    - amount: 4
      unit: cups
    notes: about 5 ears; can also use canned or frozen corn
- olive oil:
    amounts:
    - amount: 1
      unit: tablespoon
- red bell pepper:
    amounts:
    - amount: 0.5
      unit: whole
    processing:
    - chopped
- red onion:
    amounts:
    - amount: 0.5
      unit: whole
    notes: small
    processing:
    - finely chopped
- fresh cilantro:
    amounts:
    - amount: 0.5
      unit: cups
    processing:
    - chopped
- green onions:
    amounts:
    - amount: 6
      unit: whole
    processing:
    - chopped
- jalapeno pepper:
    amounts:
    - amount: 1
      unit: whole
    processing:
    - diced
- avocado:
    amounts:
    - amount: 0.5
      unit: whole
    processing:
    - chopped
- lime juice:
    amounts:
    - amount: 4
      unit: tablespoons
    notes: from about 2 limes
- ground cumin:
    amounts:
    - amount: 0.5
      unit: teaspoons
- smoked paprika:
    amounts:
    - amount: 0.5
      unit: teaspoons
- black pepper:
    amounts:
    - amount: 0.25
      unit: teaspoons
- salt:
    amounts:
    - amount: 0.25
      unit: teaspoons
- sour cream:
    amounts:
    - amount: 2
      unit: tablespoons
    notes: or yogurt
- mayonnaise:
    amounts:
    - amount: 2
      unit: tablespoons
- cotija cheese:
    amounts:
    - amount: 0.5
      unit: cups
    notes: or feta
    processing:
    - crumbled
steps:
- step: Cut the corn off the cob. You can use about 5 ears to get 4 cups. You can
    also use canned corn or frozen corn. If using frozen, no need to thaw it out.
- step: Heat the olive oil in a large skillet over high heat. Add the corn and stir
    it around. Cook for about 3 to 5 minutes or until the corn starts to char, which
    is why we're using high heat. If using frozen corn, you will need a couple minutes
    extra to get the right charred bits.
- step: Transfer the corn to a large bowl and let it cool for a couple minutes.
- step: To the same bowl, add the remaining ingredients. Stir everything together
    until well combined. Adjust lime juice and salt and pepper as necessary.
- step: Serve garnished with additional cheese and cilantro, if preferred.
