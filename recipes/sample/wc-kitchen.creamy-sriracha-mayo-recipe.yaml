recipe_uuid: wc-kitchen.creamy-sriracha-mayo-recipe
recipe_name: Creamy Sriracha Mayo Recipe
description: This homemade sriracha mayo recipe is creamy, spicy, and very easy to
  make. It'll add the perfect zing to sandwiches, veggies, and anything grilled.
source_url: https://www.chilipeppermadness.com/wprm_print/creamy-sriracha-mayo-recipe#
source_authors:
- Mike Hultquist
yields:
- amount: 20
  unit: tablespoons
ingredients:
- mayo:
    amounts:
    - amount: 1
      unit: cup
- sriracha chili sauce:
    amounts:
    - amount: 3
      unit: tablespoons
- lemon juice:
    amounts:
    - amount: 2
      unit: tablespoons
    notes: juice from about 1/2 a lemon
- garlic:
    amounts:
    - amount: 1
      unit: clove
    processing:
    - minced
steps:
- step: Whisk together the mayo, Sriracha chili sauce, lemon juice, garlic and a pinch
    of salt in a small bowl. Make sure it is nicely blended.
- step: Taste and adjust for salt.
- step: Enjoy.
notes: 'Makes 1-1/4 cup. Heat Factor: Mild-Medium. The collection of ingredients keep
  the heat of the sriracha at bay, but you''ll get plenty of zesty zing factor. Up
  the heat level with extra sriracha and/or the addition of spicy chili flakes or
  powders. Or use a hotter sriracha sauce brand.

  '
