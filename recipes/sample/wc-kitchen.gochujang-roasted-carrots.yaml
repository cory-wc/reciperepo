recipe_uuid: wc-kitchen.gochujang-roasted-carrots
recipe_name: Gochujang Roasted Carrots
yields:
- amount: 4
  unit: servings
ingredients:
- carrots:
    amounts:
    - amount: 1
      unit: lb
    notes: halve lengthwise if very large
    processing:
    - peeled
- vegetable oil:
    amounts:
    - amount: 1
      unit: tablespoon
- sesame oil:
    amounts:
    - amount: 1
      unit: tablespoon
- soy sauce:
    amounts:
    - amount: 1
      unit: tablespoon
- gochujang:
    amounts:
    - amount: 1
      unit: tablespoon
    notes: Korean chili paste
- honey:
    amounts:
    - amount: 1
      unit: tablespoon
- rice wine vinegar:
    amounts:
    - amount: 1
      unit: tablespoon
- water:
    amounts:
    - amount: 1
      unit: tablespoon
steps:
- step: Preheat your oven to 400°F.
- step: Place carrots on a rimmed baking sheet large enough to accommodate them all
    in one single layer.
- step: In a small bowl whisk together the oils, soy sauce, gochujang, honey, vinegar,
    and water.
- step: Pour this mixture all over the carrots, tossing with your hands to evenly
    coat.
- step: Cover the baking sheet tightly with two layers of aluminum foil.
- step: Roast for 20 minutes.
- step: Remove foil and roast for an additional 15–30 minutes, turning the carrots
    halfway through cooking, until they are tender in the middle and brown and caramelized
    at the edges.
- step: Garnish with chopped scallions and sesame seeds.
notes:
- Optional garnish: chopped scallions, sesame seeds.
