recipe_uuid: wc-kitchen.ratatouille
recipe_name: Ratatouille
yields:
- amount: 6
  unit: servings
ingredients:
- olive oil:
    amounts:
    - amount: 1
      unit: tbsp
- med. onion, chopped:
    amounts:
    - amount: 1
      unit: whole
- red bell peppers, chopped:
    amounts:
    - amount: 3
      unit: whole
- med. zucchini, chopped:
    amounts:
    - amount: 2
      unit: whole
- garlic, crushed:
    amounts:
    - amount: 4
      unit: cloves
- stewed tomatoes:
    amounts:
    - amount: 2
      unit: cans
steps:
- step: Heat oil over medium heat in a dutch oven or stock pot.
- step: Add onions and bell peppers. Cook until they start to soften.
- step: Add zucchini, garlic, and stewed tomatoes with juices.
- step: Cook 30-60 minutes, until all ingredients have softened and mixture has thickened.
- step: Serve with crusty french bread.
