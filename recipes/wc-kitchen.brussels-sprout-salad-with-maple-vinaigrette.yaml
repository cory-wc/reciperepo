recipe_uuid: wc-kitchen.brussels-sprout-salad-with-maple-vinaigrette
recipe_name: Brussels Sprout Salad with Maple Vinaigrette
yields:
- amount: 4
  unit: servings
ingredients:
- brussels sprouts:
    amounts:
    - amount: 8
      unit: ounce
- bacon:
    amounts:
    - amount: 2
      unit: slices
    processing:
    - cooked crisp
    - crumbled
- hazelnuts:
    amounts:
    - amount: 1
      unit: tablespoon
    processing:
    - chopped
- maple syrup:
    amounts:
    - amount: 2
      unit: tablespoon
- apple cider vinegar:
    amounts:
    - amount: 2
      unit: tablespoon
- grainy dijon mustard:
    amounts:
    - amount: 1
      unit: tablespoon
- extra virgin olive oil:
    amounts:
    - amount: 1
      unit: tablespoon
steps:
- step: Prepare the brussels sprouts by cutting off and discarding the stem. Beginning
    at the stem end, slice into very thin rounds. Discard any tough white centers.
    Add to a bowl and gently toss with a fork to separate. Add the bacon and hazelnuts.
- step: Combine the maple syrup, vinegar, mustard, and oil in a small jar. Close the
    lid and shake well to combine. Pour the dressing over the salad. Let sit 5 minutes.
    Season with cracked black pepper.
