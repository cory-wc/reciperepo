steps:
- step: Set Instant Pot to sauté and add sesame oil once the pot is hot. Stir in garlic
    and ginger and sauté until fragrant, being careful not to burn the garlic.
- step: Add in chicken, stock, water, and coconut aminos. Lock lid and press the 'soup'
    setting or manual/pressure cook for 30 minutes.
- step: After cook time is through, remove chicken and let cool. Skim the top of the
    broth to remove any fat. If you have super picky kids, you can strain out the
    ginger and garlic, but leave it in!
- step: Add ramen noodle cakes into the IP and place cover on the pot. The noodles
    should cook in the steam in just a few minutes. As soon as the noodles are soft,
    remove them from the pot and use your yellow container or a 1/2 measuring cup
    to portion out into four bowls.
- step: Next add the greens and the carrots to the pot. If your broth isn't hot enough
    for them to steam in, turn your pot to sauté and stir your veggies as they soften
    or cook on manual for zero minutes.
