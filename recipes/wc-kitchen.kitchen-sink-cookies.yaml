recipe_name: Kitchen Sink Cookies (Panera Copycat!)
description: 'These soft & chewy kitchen sink cookies can be made in one bowl and
  are loaded with chocolate chips, pretzels, and caramel! Inspired by Panera, these
  are the sweet & salty cookie of your dreams!

  '
