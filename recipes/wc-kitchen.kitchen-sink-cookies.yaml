steps:
- step: Preheat oven to 350°F.
- step: 'Chop half of the chocolate chips (½ cup) into small shards and slivers. Cut
    caramels (½ cup) into small chunks (about the size of the chocolate chips) and
    break up the pretzels (½ cup). Set aside.

    '
- step: 'In a medium-sized microwave-safe bowl, add unsalted butter (½ cup, i.e. 1
    stick) and cover with a paper towel (will help for splattering). Melt the butter
    in the microwave for 30–60 seconds until all is melted (no chunks left). You want
    it hot; if you hear it "pop" then it''s most likely done.

    '
- step: 'Add in light brown sugar (½ cup) and granulated sugar (¼ cup) and use a spatula
    to stir until combined (* do not use a mixer for this recipe). The sugars should
    cool off the butter but if it''s still piping hot, let cool for a minute or two.

    '
- step: 'Stir in egg (1 large) and vanilla extract (2 teaspoons). Next, mix in baking
    soda (½ teaspoon) and salt (¼ teaspoon).

    '
- step: 'Add all-purpose flour (1¼ cups) and mix until all the flour disappears into
    the dough. Note: the dough will be wet and sticky; this is normal and it will
    firm up as it sits.

    '
- step: 'Mix the chopped chocolate chips (½ cup), whole chocolate chips (½ cup), and
    chopped caramel (½ cup) into the dough. Allow dough to sit for 1–2 minutes to
    slightly set so it''s not as sticky, then stir (if needed, you can add 1–2 tablespoons
    flour to help it firm up).

    '
- step: 'Line a baking sheet with parchment paper. Scoop dough into ¼ cup sized scoops
    (i.e. 4 tablespoons) then gently roll into your hands to create a ball. Flatten
    the tops so that they''re a thick disc vs. a round ball. See image in post above
    for reference. Without flattening, your cookies will be thicker and more cakey.

    '
- step: 'If desired, press extra pretzel pieces into the top.

    '
- step: 'Bake at 350°F for 12–14 minutes. You want them to be slightly brown on the
    edges and top and look slightly underbaked in the center (my oven was perfect
    at 13 minutes).

    '
