recipe_uuid: wc-kitchen.crab-salad
recipe_name: Crab Salad (Seafood Salad)
description: Crab Salad with celery and mayonnaise is a delicious and inexpensive
  way to enjoy the classic Seafood Salad we all grew up with.
source_url: https://dinnerthendessert.com/crab-salad-seafood-salad/
X-original-source: ../originals/PXL_20260523_110501306.RAW-01.COVER.jpg
author: Sabrina Snyder
X-category: Salad
X-tags:
- crab
- seafood
- American
- no-cook
X-cuisine: American
X-prep_time: 10 minutes
X-total_time: 10 minutes
yields:
- amount: 2
  unit: servings
ingredients:
- imitation crab meat:
    amounts:
    - amount: 0.5
      unit: pound
- shallot:
    amounts:
    - amount: 0.5
      unit: whole
    notes: you can use red onion if you need
    processing:
    - minced
- mayonnaise:
    amounts:
    - amount: 0.25
      unit: cup
- celery:
    amounts:
    - amount: 0.25
      unit: cup
    processing:
    - minced
- paprika:
    amounts:
    - amount: 0.25
      unit: teaspoon
- dill:
    amounts:
    - amount: 0.25
      unit: teaspoon
- kosher salt:
    amounts:
    - amount: 0.13
      unit: teaspoon
- black pepper:
    amounts:
    - amount: 0.13
      unit: teaspoon
steps:
- step: In a large bowl add all the ingredients together gently, stirring until well
    coated.
- step: Refrigerate for an hour before serving.
