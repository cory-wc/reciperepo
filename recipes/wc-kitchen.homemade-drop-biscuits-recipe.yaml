recipe_uuid: wc-kitchen.homemade-drop-biscuits-recipe
recipe_name: Homemade Drop Biscuits Recipe (No Milk)
author: Brianna May
cuisine: American
X-course: Bread, Breakfast
X-original-source: ../originals/PXL_20260523_110943607.RAW-01.COVER.jpg
yields:
- amount: 15
  unit: biscuits
X-prep_time: 35 mins
X-cook_time: 20 mins
X-total_time: 55 mins
ingredients:
- all purpose flour:
    amounts:
    - amount: 2.25
      unit: cup
    notes: 293 g
- baking powder:
    amounts:
    - amount: 1
      unit: tablespoon
- salt:
    amounts:
    - amount: 1
      unit: teaspoon
- cold water:
    amounts:
    - amount: 1
      unit: cup
- honey:
    amounts:
    - amount: 1
      unit: tablespoon
    notes: marked with asterisk; see Notes — can swap for 1 Tablespoon white or brown
      sugar
- white vinegar:
    amounts:
    - amount: 1
      unit: tablespoon
    notes: marked with asterisk
- unsalted butter:
    amounts:
    - amount: 1
      unit: stick
    notes: chilled in freezer for 30 minutes to 1 hour, then grated; marked with asterisk
optional_add_ins_and_topping:
- garlic powder:
    amounts:
    - amount: 0.5
      unit: teaspoon
- cheddar cheese:
    amounts:
    - amount: 0.75
      unit: cup
- chives:
    amounts:
    - amount: 0.25
      unit: cup
honey_butter:
- honey:
    amounts:
    - amount: 1
      unit: tablespoon
- unsalted butter:
    amounts:
    - amount: 2
      unit: tablespoon
    notes: melted
steps:
- step: Preheat the oven to 425°F. Line a baking sheet with parchment paper.
- step: In a medium bowl, whisk together the flour, baking powder, and salt.
- step: In a separate bowl, whisk together the water, honey, and vinegar.
- step: Add the butter to the dry ingredients and stir until well combined.
- step: Pour about half of the water mixture over the butter and dry ingredients.
    Stir gently.
- step: Add the rest of the water mixture. Continue stirring just until the dough
    comes together.
- step: Drop about 2 heaping tablespoons of dough onto the baking sheet to form about
    15 biscuits.
- step: Bake for 16–18 minutes or until the tops begin to turn golden brown. Brush
    with additional melted butter or honey butter before serving.
notes:
- 'Honey: Swap honey for 1 Tablespoon of white or brown sugar.'
- 'Butter asterisk note: chilled in freezer for 30 minutes to 1 hour and grated.'
- Optional add-ins and honey butter topping are listed separately from core ingredients.
