recipe_uuid: wc-kitchen.honey-apple-galette-with-pistachio-sugar
recipe_name: Honey Apple Galette With Pistachio Sugar
yields:
- amount: 8
  unit: servings
ingredients:
- name_group: Dough
- all-purpose flour:
    amounts:
    - amount: 2.25
      unit: cups
    notes: plus more for rolling
- kosher salt:
    amounts:
    - amount: 1
      unit: teaspoons
- unsalted butter:
    amounts:
    - amount: 1
      unit: cups
    notes: 2 sticks; cut into ½-inch pieces, cold
- ice water:
    amounts:
    - amount: 1/2
      unit: cups
    notes: ½ to ¾ cup
- name_group: Filling
- Granny Smith apples:
    amounts:
    - amount: 4
      unit: whole
    notes: about 3 lb; unpeeled, very thinly sliced
- unsalted butter (filling):
    amounts:
    - amount: 6
      unit: tablespoons
    notes: melted
- granulated sugar (filling):
    amounts:
    - amount: 4
      unit: tablespoons
- honey:
    amounts:
    - amount: 3
      unit: tablespoons
- lemon zest:
    amounts:
    - amount: 1
      unit: tablespoons
- lemon juice:
    amounts:
    - amount: 1
      unit: tablespoons
    notes: fresh; from 1 lemon
- kosher salt (filling):
    amounts:
    - amount: 1/2
      unit: teaspoons
- name_group: Assembly
- raw unsalted pistachios:
    amounts:
    - amount: 1/4
      unit: cups
- granulated sugar (topping):
    amounts:
    - amount: 3
      unit: tablespoons
- egg:
    amounts:
    - amount: 1
      unit: whole
    notes: beaten, for egg wash
steps:
- step: Make the dough — combine flour and salt in a food processor. Add butter and
    pulse until most of the butter is in pea-sized pieces, about 20 pulses. While
    pulsing, drizzle in ice water until dough just holds together. Turn out, wrap
    tightly, and refrigerate at least 2 hours or up to 3 days (or freeze up to 1 month).
- step: Prepare the filling — place apple slices in a large bowl. Add melted butter,
    sugar, honey, lemon zest, lemon juice, and salt. Toss to coat.
- step: Assemble — roll chilled dough into a 16-inch round on a lightly floured surface.
    Transfer to a parchment-lined baking sheet. Fan apple slices over the dough, leaving
    a 4-inch border. Fold the border of dough up over the edge of the filling, overlapping
    as needed. Brush crust with beaten egg. Pulse pistachios and sugar to make pistachio
    sugar; sprinkle over galette.
- step: Freeze for 1 hour.
- step: Preheat oven to 375°F. Bake 50 to 55 minutes, until crust is golden and apples
    are tender. Refrigerate for 10 minutes before serving; can hold up to 4 hours.
