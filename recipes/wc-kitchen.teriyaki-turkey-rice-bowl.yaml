recipe_uuid: wc-kitchen.teriyaki-turkey-rice-bowl
recipe_name: Teriyaki Turkey Rice Bowl

yields:
  - amount: 4
    unit: servings

ingredients:
  - teriyaki sauce:
      amounts:
        - amount: "1 3/4"
          unit: cups

  - oil:
      amounts:
        - amount: 1
          unit: tablespoon

  - onion:
      amounts:
        - amount: 1
          unit: medium
      processing:
        - diced

  - garlic:
      amounts:
        - amount: 4
          unit: cloves
      processing:
        - minced

  - ground turkey:
      amounts:
        - amount: 1
          unit: lb

  - broccoli:
      amounts:
        - amount: 1
          unit: cup
      processing:
        - grated or chopped finely

  - carrots:
      amounts:
        - amount: 2
          unit: carrots
      processing:
        - grated or chopped finely

  - green onions:
      amounts:
        - amount: 2
          unit: green onions
      processing:
        - diced
        - for garnish

  - cooked rice:
      amounts:
        - amount: 4
          unit: cups

steps:
  - step: Start the rice in a rice cooker, stovetop, or instant pot.
  - step: Heat oil in a large skillet over medium-high heat. Cook onions until soft.
  - step: Add ground turkey and garlic. Cook for 3-4 minutes, until the turkey is about half done.
  - step: Add veggies (carrots, broccoli). Cook until the turkey is done.
  - step: Pour teriyaki sauce over the meat and vegetable mixture and stir. Simmer on low for 5 minutes.
  - step: Spoon meat over rice or noodles. Garnish with green onion.

source_url: https://www.yellowblissroad.com
X-total_time: 25 minutes
X-notes: "Ground beef can be substituted for turkey. Add minced/grated mushrooms for extra veggies. Bulgogi sauce can be substituted to make a bulgogi rice bowl. Top with quick-pickled onions."
