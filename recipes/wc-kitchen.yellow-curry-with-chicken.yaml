steps:
- step: Using oil, saute onion and garlic until translucent.
- step: Add the potatoes, chicken, chickpeas, brown sugar, spices, and stock.
- step: Cook on high pressure for 5 minutes.
- step: Allow pressure to release for 10 minutes.
- step: While cooking, mix cornstarch and water in a small bowl.
- step: Stir in cornstarch slurry, lime juice, and coconut milk. Add salt and pepper
    to taste.
- step: Serve with rice.
notes:
- To make rice at the same time as curry, use the pot-in-pot method with 1½ cups rice
  and 1½ cups water.
