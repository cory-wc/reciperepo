recipe_name: Ball RealFruit Low or No-Sugar Jam (Scaling Reference Table)
description: 'Ingredient scaling table for jam made in (8 oz) Half Pint Jars using
  Ball RealFruit Low or No-Sugar Needed Pectin. Covers 1–9 jars in both Low Sugar
  and No Sugar variants. Only the tail end of the full recipe is visible (step 4 and
  a "Hide" link); full method steps are not captured in this image.

  '
