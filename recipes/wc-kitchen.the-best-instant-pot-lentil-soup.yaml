steps:
- step: 'Add all ingredients to Instant Pot in order that they are listed with the
    exception of spinach. Place lid on Instant Pot and make sure valve is set to seal.

    '
- step: 'Press the pressure cook button and set to high, then cook for 5 minutes.
    Instant Pot will take about 10-15 minutes to come to pressure then pressure cook
    the 5 minutes.

    '
- step: 'Do a quick release of the pressure on the Instant Pot by flicking the switch
    at the top with a spoon. Open the lid when pressure gauge has dropped and the
    lid opens easily.

    '
- step: 'Remove 1 cup of the soup and blend in a blender once cooled, then add back
    to pot of soup (this is an optional step that makes the dish more creamy and delicious).
    Stir in spinach, then serve with fresh bread and enjoy!

    '
