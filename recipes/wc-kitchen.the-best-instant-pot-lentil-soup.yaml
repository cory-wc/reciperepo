steps:
- step: Add all ingredients to the Instant Pot in the order listed, except the spinach.
    Place lid on Instant Pot and make sure valve is set to seal.
- step: Press the pressure cook button and set to high, then cook for 5 minutes. The
    Instant Pot will take about 10–15 minutes to come to pressure before the 5-minute
    cook time begins.
- step: Do a quick release of the pressure by flicking the switch at the top with
    a spoon. Open the lid when the pressure gauge has dropped and the lid opens easily.
- step: Remove 1 cup of the soup and blend in a blender once cooled, then add back
    to pot of soup (optional — makes the dish more creamy). Stir in spinach, then
    serve with fresh bread.
