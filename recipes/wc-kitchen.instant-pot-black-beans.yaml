recipe_uuid: wc-kitchen.instant-pot-black-beans
recipe_name: Instant Pot Black Beans
description: My Instant Pot Black Beans recipe makes a simple, tasty, healthy & budget-friendly
  dinner. They are really quick and easy to make with no soaking involved. They are
  great to have on hand for simple dinners and meal prep!
source_url: https://avirtualvegan.com/instant-pot-vegan-seasoned-black-beans/
source_authors:
- Melanie McDonald
yields:
- amount: 8
  unit: servings
ingredients:
- dried black beans:
    amounts:
    - amount: 2.5
      unit: cups
    - amount: 450
      unit: g
    notes: no need to soak before using
- onion:
    amounts:
    - amount: 1
      unit: whole
    notes: medium
    processing:
    - finely chopped
- garlic:
    amounts:
    - amount: 4
      unit: cloves
    processing:
    - finely chopped
- chili flakes:
    amounts:
    - amount: 1
      unit: teaspoon
    notes: or 1 fresh chili; can omit if preferred
- ground cumin:
    amounts:
    - amount: 1
      unit: tablespoon
- ground coriander:
    amounts:
    - amount: 1
      unit: teaspoon
- bay leaf:
    amounts:
    - amount: 1
      unit: whole
    notes: large
- dried mint:
    amounts:
    - amount: 1
      unit: teaspoon
    notes: optional but recommended if you have it
- flavourful broth or stock:
    amounts:
    - amount: 3
      unit: cups
    - amount: 720
      unit: ml
- lime:
    amounts:
    - amount: 1
      unit: whole
    processing:
    - juiced
- salt:
    amounts:
    - amount: 1
      unit: teaspoon
    notes: up to 1 teaspoon, plus more to taste if required
steps:
- step: Add all ingredients except the lime to the Instant Pot and stir.
- step: Put the lid on the Instant Pot and seal the vent.
- step: Cook on high pressure MANUAL or PRESSURE COOK (in newer models) for 25 minutes
    for tender, soft beans (or 30 minutes if you prefer really soft slightly mushy
    beans) and leave the pressure to release naturally before opening the lid. Note
    that the beans continue to cook during the natural pressure release so if you
    skip this step and vent manually your beans will turn out much firmer.
- step: Add salt to taste then squeeze the juice of the lime into the beans and give
    them a quick stir before serving.
