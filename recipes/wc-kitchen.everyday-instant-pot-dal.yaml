recipe_uuid: wc-kitchen.everyday-instant-pot-dal
recipe_name: Everyday Instant Pot Dal
source_url: https://www.hookedonheat.com
X-original-source: ../originals/everyday-instant-pot-dal-20260523.jpg
X-prep_time: 10 mins
X-cook_time: 20 mins
X-total_time: 30 mins
yields:
- amount: 4
  unit: servings
ingredients:
- light cooking oil:
    amounts:
    - amount: 2
      unit: tablespoons
- cumin seeds:
    amounts:
    - amount: 1
      unit: teaspoon
- garlic:
    amounts:
    - amount: "2–3"
      unit: cloves
    notes: large
    processing:
    - bruised
- ginger:
    amounts:
    - amount: "2–3"
      unit: slices
    notes: thin slices
- onion:
    amounts:
    - amount: 1
      unit: whole
    notes: medium
    processing:
    - finely chopped
- turmeric powder:
    amounts:
    - amount: 0.25
      unit: teaspoon
- red chilli powder:
    amounts:
    - amount: 0.25
      unit: teaspoon
- coriander powder:
    amounts:
    - amount: 0.5
      unit: teaspoon
- tomato:
    amounts:
    - amount: 1
      unit: whole
    notes: large
    processing:
    - finely chopped
- red lentils:
    amounts:
    - amount: 2
      unit: cups
