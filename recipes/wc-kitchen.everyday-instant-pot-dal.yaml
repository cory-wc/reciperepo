recipe_uuid: wc-kitchen.everyday-instant-pot-dal
recipe_name: Everyday Instant Pot Dal
source_url: https://www.hookedonheat.com
X-original-source: ../originals/PXL_20260523_111039285.RAW-01.COVER.jpg
yields:
- amount: 4
  unit: servings
X-prep_time: 10 mins
X-cook_time: 20 mins
X-total_time: 30 mins
ingredients:
- light cooking oil:
    amounts:
    - amount: 2
      unit: tbsp
- cumin seeds:
    amounts:
    - amount: 1
      unit: tsp
- large garlic cloves:
    amounts:
    - amount: 2-3
      unit: null
    notes: bruised
- ginger:
    amounts:
    - amount: 2-3
      unit: thin slices
- medium-sized onion:
    amounts:
    - amount: 1
      unit: null
    notes: finely chopped
- turmeric powder:
    amounts:
    - amount: 0.25
      unit: tsp
- red chilli powder:
    amounts:
    - amount: 0.25
      unit: tsp
- coriander powder:
    amounts:
    - amount: 0.5
      unit: tsp
- salt:
    amounts:
    - amount: null
      unit: to taste
- large tomato:
    amounts:
    - amount: 1
      unit: null
    notes: finely chopped; also known as masoor dal, thoroughly washed and drained
- red lentils:
    amounts:
    - amount: 2
      unit: cups
- water:
    amounts:
    - amount: 3
      unit: cups
- fresh cilantro leaves:
    amounts:
    - amount: null
      unit: null
    notes: finely chopped, for garnish
steps:
- step: Turn on the Instant Pot and set to Saute mode. Once it's heated, add in oil
    and cumin seeds.
- step: Once the cumin seeds start to sizzle, add in the garlic, ginger and chopped
    onions. Fry for a few minutes, stirring occasionally, till onions start to brown.
- step: Add in spices and salt, and give it a quick mix. Add in chopped tomatoes and
    let it cook for a couple of minutes till the tomatoes start to soften and pulp.
- step: Mix in the lentils and water and let it come to a quick boil. Put on the lid
    and set the Instant Pot to manual Pressure Cook mode for 8 minutes, making sure
    that the valve is on the sealing position.
- step: Let the pressure release naturally before removing the lid. Give it a good
    stir and garnish with cilantro leaves before serving.
notes:
- Once the Dal is done cooking, if you'd like the consistency on the Dal thinner,
  then set the Instant Pot to Saute mode, add in some water and let it come to a boil.
  If you'd like it thicker, then set the Instant Pot to Saute mode and let it cook
  down slightly, stirring occasionally to avoid burning.
