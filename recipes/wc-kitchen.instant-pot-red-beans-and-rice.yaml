steps:
- step: Add all ingredients besides sausage to instant pot, close lid and manually
    cook for 45 minutes. (Original printed value of 30 minutes crossed out and corrected
    to 45 in handwriting.)
- step: Quick release the pressure and then add in your sausage.
- step: Manual cook for about 15 minutes and then let it naturally release.
- step: Once pin is up remove lid and using a potato masher or whatever you have mash
    about half of your beans.
- step: Stir and serve over rice.
