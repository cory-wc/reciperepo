recipe_name: Instant Pot Red Beans and Rice
ingredients:
- onion:
    amounts:
    - amount: 1
      unit: whole
    processing:
    - chopped
- green bell pepper:
    amounts:
    - amount: 1
      unit: whole
    processing:
    - chopped
- dried red kidney beans:
    amounts:
    - amount: 1
      unit: pounds
- garlic:
    amounts:
    - amount: 3
      unit: cloves
    processing:
    - minced
- creole seasoning:
    amounts:
    - amount: 2
      unit: tablespoons
- bay leaves:
    amounts:
    - amount: 2
      unit: whole
    notes: optional
- water:
    amounts:
    - amount: 6.5
      unit: cups
    notes: original printed value crossed out; handwritten correction appears to be
      6.5 cups
- sausage:
    amounts:
    - amount: 1
      unit: pounds
    notes: original text says andouille, crossed out and handwritten as kielbasa,
      low sodium
    processing:
    - sliced
steps:
- step: Add all ingredients besides sausage to instant pot, close lid and manually
    cook for 45 minutes. (Original printed value of 30 minutes crossed out and corrected
    to 45 in handwriting.)
- step: Quick release the pressure and then add in your sausage.
- step: Manual cook for about 15 minutes and then let it naturally release.
- step: Once pin is up remove lid and using a potato masher or whatever you have mash
    about half of your beans.
- step: Stir and serve over rice.
notes:
- Serve over rice.
