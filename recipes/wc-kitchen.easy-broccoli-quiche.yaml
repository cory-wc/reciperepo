steps:
- step: Preheat oven to 350°F (175°C). Line a 9-inch deep-dish pie pan with crust.
- step: Melt 2 tablespoons butter in a large saucepan over medium-low heat. Add onion,
    garlic, and broccoli. Cook slowly, stirring occasionally, until vegetables are
    soft. Spoon vegetables into crust and sprinkle with cheese.
- step: Combine eggs and milk. Season with salt and pepper. Stir in remaining 1 tablespoon
    melted butter. Pour egg mixture over vegetables and cheese.
- step: Bake in preheated oven until center has set, 30 to 50 minutes.
