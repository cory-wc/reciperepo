recipe_uuid: wc-kitchen.slow-cooker-beef-stew
recipe_name: Slow Cooker Beef Stew
X-original-source: ../originals/PXL_20260523_105952998.RAW-01.COVER.jpg
X-attribution: Original recipe from a farmgirl's dabbles
X-category: Main Dish
X-tags:
- slow cooker
- beef
- stew
- comfort food
X-total_time: 6 hours 30 minutes

yields:
- amount: 10
  unit: servings

ingredients:
- olive oil:
    amounts:
    - amount: 1
      unit: tablespoons
- boneless beef chuck roast:
    amounts:
    - amount: 2
      unit: lbs
    processing:
    - cut into 1-inch cubes
- mushrooms:
    amounts:
    - amount: 8
      unit: oz
    processing:
    - sliced thinly
- carrots:
    amounts:
    - amount: 1.5
      unit: lbs
    processing:
    - sliced 1/2-inch diagonally
- garlic:
    amounts:
    - amount: 6
      unit: cloves
- yellow potatoes:
    amounts:
    - amount: 4
      unit: whole
    notes: medium
    processing:
    - cut into 1-inch cubes
- onion:
    amounts:
    - amount: 1
      unit: whole
    notes: medium
    processing:
    - chopped
- beef broth:
    amounts:
    - amount: 6
      unit: cups
- dry red wine:
    amounts:
    - amount: 1
      unit: cups
- tomato paste:
    amounts:
    - amount: 0.25
      unit: cups
- Dijon mustard:
    amounts:
    - amount: 1
      unit: tablespoons
- dried thyme:
    amounts:
    - amount: 1
      unit: teaspoons
- pearl barley or farro:
    amounts:
    - amount: 0.75
      unit: cups
    notes: optional
- bay leaves:
    amounts:
    - amount: 3
      unit: leaves

steps:
- step: Sprinkle beef with salt and pepper. Brown meat in olive oil. Drain excess
    fat and transfer to slow cooker.
- step: Add all ingredients to slow cooker and stir.
- step: Cover and cook on high for 4 hours, then turn heat to low and cook for 2 more
    hours.

notes:
- Serve with fresh baguette.

