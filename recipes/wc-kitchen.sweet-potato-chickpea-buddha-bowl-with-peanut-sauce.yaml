steps:
- step: Add the cubed sweet potato and rinsed chickpeas in a bowl and toss with all
    spices/seasonings until well combined.
- step: Add to a baking sheet lined with parchment paper and bake for 30–35 minutes
    or until the sweet potato can be easily pierced with a fork.
- step: Cook your grain according to package instructions using a 1:2 grain-to-water
    ratio. Cook the grain in veggie broth for a little extra flavor.
- step: Meanwhile, add the edamame and broccoli to a pot with 1 inch of water and
    steam for 5–7 minutes or until the broccoli is just barely fork tender. Drain
    off the excess water.
- step: When the potatoes/chickpeas are done, assemble the bowls with a base of your
    grain of choice, then add the steamed veggies, sweet potato/chickpeas, avocado
    and top with a generous serving of peanut sauce, chopped cilantro and crushed
    peanuts. Add red pepper flakes for extra spice if desired.
notes:
- In place of broccoli you can use sautéed kale or asparagus, or even roast the broccoli
  with the sweet potatoes for more flavor. Anything goes — fresh spinach also works
  and will wilt slightly with the warm grains.
- For the peanut sauce, the recipe calls for 1/4–1/2 cup of water; author uses closer
  to 1/2 cup and adds a little extra spice.
- Almond butter can be substituted for peanut butter in the sauce.
