recipe_uuid: wc-kitchen.tomato-relish
recipe_name: Tomato Relish
yields:
- amount: 2
  unit: kg
ingredients:
- tomatoes:
    amounts:
    - amount: 2
      unit: kg
    processing:
    - chopped
- onion:
    amounts:
    - amount: 3
      unit: whole
    notes: medium
    processing:
    - peeled
    - chopped
- salt:
    amounts:
    - amount: 2
      unit: tablespoons
- mustard powder:
    amounts:
    - amount: 3
      unit: teaspoons
- curry powder:
    amounts:
    - amount: 3
      unit: teaspoons
- sugar:
    amounts:
    - amount: 500
      unit: g
- vinegar:
    amounts:
    - amount: 3
      unit: cups
    notes: white or cider
- cornflour:
    amounts:
    - amount: 1
      unit: tablespoons
- vinegar (extra):
    amounts:
    - amount: 1/4
      unit: cups
steps:
- step: Place the tomatoes, onions, salt, mustard powder, curry powder, sugar and
    vinegar in a large saucepan. Bring to the boil, stirring until the sugar is dissolved,
    and continue to boil for 1½ hours.
- step: Mix the cornflour to a paste with the extra vinegar, add some or all to the
    boiling mixture and stir till thickened. Pour into sterilised jars and seal immediately.
