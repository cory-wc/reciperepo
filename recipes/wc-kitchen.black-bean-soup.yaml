steps:
- step: Heat the oil in a large pot over medium-high heat. Add the onion, carrot,
    celery, and jalapeno pepper, and cook for 4 to 5 minutes, or until softened.
- step: Add the garlic, cumin, oregano, coriander, cayenne pepper, and salt, and stir
    together for another minute, until fragrant.
- step: Add the black beans and chicken broth, stir, and bring to a boil. Reduce the
    heat to low, cover the pot, and simmer for 15 minutes.
- step: Using an immersion blender, puree the soup a few times to have a mix of creamy
    and chunky textures. Alternatively, you can scoop out a cup or two of soup, blend
    it in a standard blender until smooth, and then stir it back into the pot. Then,
    stir in the lime juice.
- step: Ladle the soup into individual bowls and garnish with your favorite toppings.
