recipe_name: Ground Turkey & Potato Skillet
description: Wondering what to make tonight? Quickly throw together this hearty one
  pot meal of turkey and potatoes! Serve over roasted veggies, traditional rice, or
  cauliflower rice for a healthy and satisfying dinner.
