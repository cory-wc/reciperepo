steps:
- step: Add your ground turkey (or beef) to a skillet on the stovetop. Use your spatula
    to crumble the meat. Cook on medium high, stirring occasionally, until browned.
    Stir in salt, pepper, garlic powder, chili powder, and oregano. Remove from pan
    and set aside.
- step: Add the oil to the skillet. Once the oil is hot, add the diced potatoes. Sauté
    on medium high heat, stirring occasionally until sides of potatoes have browned.
    This can take 5 to 10 minutes depending on your stove and potatoes. (Instructions
    cut off in image — remainder not visible.)
