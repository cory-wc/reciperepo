recipe_uuid: wc-kitchen.crispy-slow-cooker-carnitas
recipe_name: Crispy Slow Cooker Carnitas

yields:
  - amount: 7
    unit: servings

ingredients:
  - lean boneless pork roast:
      amounts:
        - amount: "4-5"
          unit: lb
      processing:
        - excess fat trimmed
        - cut into 3-inch chunks

  - beer:
      amounts:
        - amount: 1
          unit: cup
      processing:
        - or chicken stock

  - white onion:
      amounts:
        - amount: 1
          unit: medium
      processing:
        - diced

  - garlic:
      amounts:
        - amount: 4
          unit: cloves
      processing:
        - peeled and minced

  - chipotle powder:
      amounts:
        - amount: 1
          unit: tablespoon
      processing:
        - or 1 chipotle in adobo sauce, minced

  - ground cumin:
      amounts:
        - amount: 2
          unit: teaspoons

  - black pepper:
      amounts:
        - amount: 1
          unit: teaspoon

  - chili powder:
      amounts:
        - amount: 1
          unit: teaspoon

  - fine sea salt:
      amounts:
        - amount: "1 1/2"
          unit: teaspoons

steps:
  - step: Add all ingredients to a large slow cooker, and give the mixture a stir to combine.

