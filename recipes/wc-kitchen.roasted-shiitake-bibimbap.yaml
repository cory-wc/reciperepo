recipe_uuid: wc-kitchen.roasted-shiitake-bibimbap
recipe_name: Roasted Shiitake Bibimbap

yields:
  - amount: 2
    unit: servings

ingredients:
  - sushi rice:
      amounts:
        - amount: 3/4
          unit: cup

  - sweet potato:
      amounts:
        - amount: 1
          unit: sweet potato

  - shiitake mushrooms:
      amounts:
        - amount: 8
          unit: oz

  - cucumber:
      amounts:
        - amount: 1/2
          unit: cucumber

  - garlic:
      amounts:
        - amount: 1
          unit: clove

  - dark brown sugar:
      amounts:
        - amount: 1
          unit: tablespoon

  - soy sauce:
      amounts:
        - amount: 2
          unit: tablespoons

  - gochujang:
      amounts:
        - amount: 2
          unit: teaspoons

  - rice vinegar:
      amounts:
        - amount: 2
          unit: tablespoons

  - sesame oil:
      amounts:
        - amount: 2
          unit: tablespoons

  - baby spinach:
      amounts:
        - amount: 5
          unit: oz

  - sriracha sauce:
      amounts:
        - amount: 2
          unit: tablespoons

  - canola oil:
      amounts:
        - amount: 1/4
          unit: cup

  - water:
      amounts:
        - amount: "1 1/4"
          unit: cups

  - eggs:
      amounts:
        - amount: 2
          unit: eggs

steps:
  - step: Preheat oven to 425.
  - step: "In a small pot, combine rice, 1¼ cups water, and salt. Bring to boil over high heat. Stir, reduce heat to low, cover pot, and cook for 12 minutes. Remove pot from heat and let stand for 10 minutes."
  - step: Rinse sweet potato and cut into ¼ inch half-moons. Clean mushrooms and halve caps, discarding stems. Mince garlic.
  - step: In a small bowl, whisk together brown sugar, soy sauce, gochujang, and 2 tbsp canola oil.
  - step: Place sweet potatoes and mushrooms on baking sheet. Pour over soy sauce mixture and toss to combine. Roast until vegetables are tender and slightly browned, about 20 minutes.
  - step: Rinse cucumber, quarter, and cut into ¼ inch slices. Combine cucumber and rice vinegar in a small bowl. Set aside to pickle.
  - step: Heat sesame oil in a large nonstick pan over medium-high heat. When oil is hot, add rice. Cook without stirring until golden on bottom, about 4 minutes per side. Transfer to serving bowls.
  - step: Add remaining canola oil to pan over medium heat. Add garlic and cook about 1 minute. Add spinach, season with pinch of salt, and saute to wilt. Transfer spinach to bowls.
  - step: Wipe pan clean and fry eggs.
  - step: Transfer eggs and roasted vegetables to bowls. Top with pickled cucumber. Drizzle with sriracha.

