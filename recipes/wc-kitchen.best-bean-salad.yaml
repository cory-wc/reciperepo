recipe_uuid: wc-kitchen.best-bean-salad
recipe_name: Best Bean Salad
description: This three-bean salad is delicious. I'd turned my nose up at this for
  years, but suddenly I can't get enough of it. Thanks, Momma D!
source_url: https://www.allrecipes.com
