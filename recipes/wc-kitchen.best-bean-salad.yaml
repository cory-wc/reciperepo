steps:
- step: Combine garbanzo beans, kidney beans, black beans, green beans, wax beans,
    green pepper, onion, and celery in a large bowl; toss to mix.
- step: Whisk together sugar, oil, vinegar, salt, and pepper in a separate bowl until
    sugar is dissolved; pour over bean mixture. Mix well.
- step: Refrigerate salad for 8 hours to overnight before serving.
