- turmeric:
    amounts:
    - amount: 2
      unit: teaspoons
- pasta:
    amounts:
    - amount: 2
      unit: cups
    notes: small shells or elbows
steps:
- step: Heat oil over medium heat in a dutch oven or stock pot.
- step: Add chicken and onions. Saute until chicken is cooked through and onions are
    translucent.
- step: Add remaining vegetables, garlic, broth, and spices.
- step: Bring to a boil, then cover and reduce heat to simmer for 45 minutes.
- step: Add pasta and continue to cook until pasta is al dente.
