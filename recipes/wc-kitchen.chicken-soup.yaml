recipe_uuid: wc-kitchen.chicken-soup
recipe_name: Chicken Soup
yields:
- amount: 8
  unit: servings
ingredients:
- olive oil:
    amounts:
    - amount: 1
      unit: tablespoons
- chicken thighs:
    amounts:
    - amount: 1
      unit: lbs
    processing:
    - cubed
- celery:
    amounts:
    - amount: 4
      unit: stalks
    notes: 4–5 stalks
    processing:
    - diced
- carrots:
    amounts:
    - amount: 4
      unit: whole
    notes: 4–5 carrots
    processing:
    - chopped
- onions:
    amounts:
    - amount: 2
      unit: whole
    processing:
    - chopped
- zucchini:
    amounts:
    - amount: 1
      unit: whole
    notes: medium
    processing:
    - diced
- mushrooms:
    amounts:
    - amount: 1/2
      unit: lbs
    processing:
    - diced
- garlic:
    amounts:
    - amount: 4
      unit: cloves
    processing:
    - crushed
- chicken broth:
    amounts:
