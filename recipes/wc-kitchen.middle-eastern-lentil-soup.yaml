steps:
- step: Heat the olive oil in a large saucepan over medium high heat. Add the diced
    onion, carrot and potato. Sauté for about five minutes until onions have softened,
    stirring occasionally.
- step: Rinse the lentils well, removing any debris. Add to the saucepan, and sauté
    for three minutes, stirring constantly so they don't stick to the bottom of the
    pan.
- step: Add the six cups of water, the stock cubes, and all the dried herbs plus the
    salt and pepper (the dried mint all the way through to black pepper). Let the
    soup come to a boil, stirring occasionally, then reduce heat to medium and let
    the mixture cook uncovered for 25–30 minutes, or until lentils and vegetables
    are cooked through.
