recipe_uuid: wc-kitchen.dense-bean-salad
recipe_name: Dense Bean Salad
description: 'A high-protein hearty mix of chickpeas, cannellini beans, crisp vegetables,
  olives, and feta in a tangy oregano-garlic vinaigrette. Perfect for meal prepped
  lunches and popular at potlucks!

  '
author: Brita Britnell
