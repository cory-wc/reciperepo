steps:
- step: 'Make the dressing by whisking together red wine vinegar, honey (or maple
    syrup), oregano, garlic, salt, and pepper. Slowly whisk in the olive oil until
    combined.

    '
- step: 'In a large mixing bowl, add beans, bell peppers, cucumbers, red onion, parsley,
    olives, and feta.

    '
- step: 'Pour the dressing over the salad and toss gently until everything is evenly
    coated.

    '
- step: 'For best flavor, cover and refrigerate for at least 30 minutes before serving.
    Stir again before enjoying.

    '
notes:
- Store in an airtight container in the fridge for up to 4 days.
