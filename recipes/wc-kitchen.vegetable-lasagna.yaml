steps:
- step: Preheat the oven to 425 degrees Fahrenheit.
- step: To prepare the veggies, in a large skillet over medium heat, warm the olive
    oil over medium heat. Once shimmering, add the carrots, bell pepper, zucchini,
    yellow onion, and salt. Cook, stirring every couple of minutes, until the veggies
    are golden on the edges, about 8 to 12 minutes.
- step: Add a few large handfuls of spinach. Cook, stirring frequently, until the
    spinach has wilted. Repeat with remaining spinach and cook until all of the spinach
    has wilted, about 3 minutes. Remove the skillet from the heat and set aside.
- step: Meanwhile, to prepare the tomato sauce, pour the tomatoes into a mesh sieve
    or fine colander and drain off the excess juice for a minute. Then, transfer the
    drained tomatoes to the bowl of a food processor. Add the basil, olive oil, garlic,
    salt, and red pepper flakes.
- step: Pulse the mixture about 10 times, until the tomatoes have broken down to an
    easily spreadable consistency. Pour the mixture into a bowl for later (you should
    have a little over 2 cups sauce). Rinse out the food processor and return it to
    the machine.
- step: Pour half of the cottage cheese (1 cup) into the processor and blend it until
    smooth, about 1 minute. Transfer the mixture to a large mixing bowl. No need to
    rinse out the bowl of the food processor this time; just put it back onto the
    machine because you'll need it later.
- step: Transfer the cooked veggies and spinach mixture to the bowl of the food processor.
    Pulse until they are more finely chopped (but not puréed!), about 5 to 7 times,
    stopping to scrape down the sides as necessary. Transfer the mixture to the bowl
    of whipped cottage cheese. Top with the remaining cottage cheese, then add 1/4
    to 1/2 teaspoon salt (to taste) and lots of freshly ground black pepper. Stir
    to combine.
- step: Spread 1/2 cup tomato sauce evenly over the bottom of a 9" by 9" baking dish.
    Layer 3 lasagna noodles on top (snap off their ends to fit, and/or overlap their
    edges as necessary). Spread half of the cottage cheese mixture evenly over the
    noodles. Top with 3/4 cup tomato sauce, then sprinkle 1/2 cup shredded cheese
    on top.
- step: Top with 3 more noodles, followed by the remaining cottage cheese mixture
    (we're skipping the tomato sauce in this layer). Sprinkle 1/2 cup shredded cheese
    on top.
- step: Top with 3 more noodles, then spread 3/4 cup tomato sauce over the top (you
    may have a little sauce leftover) to evenly cover the noodles. Sprinkle evenly
    with 1 cup shredded cheese.
- step: Wrap a sheet of parchment paper around the top of the lasagna (or cover the
    lasagna with aluminum foil, but don't let the foil touch the cheese). Bake, covered,
    for 18 minutes, then remove the cover, rotate the pan by 180° and continue cooking
    for about 10 to 12 more minutes, until the top is turning spotty brown.
- step: Remove from oven and let the lasagna cool for 15 to 20 minutes, so it has
    time to set and cool down to a reasonable temperature. Sprinkle additional basil
    over the top, then slice and serve.
