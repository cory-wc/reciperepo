recipe_name: Crescent Ring Breakfast Wreath
description: 'A great combination of bacon, egg, cheese, and golden brown pastry,
  this festive crescent ring breakfast wreath makes a wonderful surprise for guests.
  Look for crescent dinner rolls in the refrigerated section of the grocery store
  (they come in a can). You can use the cheese of your choice or even substitute chopped
  deli ham for bacon if you have that on hand. Add jalapeno to the pepper mix for
  a kick. In other words, it''s easy to tailor this savory pastry to your tastes.

  '
