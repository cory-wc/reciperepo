steps:
- step: Preheat oven to 375°F. Cook bacon in a large skillet over medium until crisp,
    5 to 6 minutes. Place bacon on a plate lined with paper towels to drain. Roughly
    chop bacon.
- step: Separate crescent roll dough into triangles. Arrange triangles in a circle,
    wide ends facing in and points facing out like a sun, and shingling wide ends
    by about half, on a rimless baking sheet lined with parchment paper. Press overlapping
    pieces to create a solid sheet of dough. (There will be an 8- or 9-inch open circle
    in the center.) Chill until ready to use.
- step: Heat oil in skillet over medium-high. Add onion; cook, stirring often, until
    translucent, 5 to 6 minutes. Add bell pepper; cook, stirring occasionally, until
    tender, 3 to 4 minutes. Whisk together eggs, salt, and black pepper in a bowl.
