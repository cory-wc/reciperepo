- recipe_name: Crispy Potato Pancakes (Latkes)
  yields:
  - amount: 20
    unit: 4-inch pancakes
  ingredients:
  - russet potatoes:
      amounts:
      - amount: 4
        unit: whole
      notes: medium
      processing:
      - peeled
      - coarsely grated
  - onions:
      amounts:
      - amount: 2
        unit: whole
      notes: medium
      processing:
      - coarsely grated
  - egg whites:
      amounts:
      - amount: 2
        unit: whole
      processing:
      - lightly beaten
  - chives:
      amounts:
      - amount: 0.25
        unit: cup
      processing:
      - finely chopped
  - vegetable oil:
      amounts: []
      notes: for frying
  steps:
  - step: Using a box grater or food processor, coarsely grate the potatoes and onions.
      Put the grated potatoes and onions together in cheesecloth or a tea towel and
      twist it to squeeze out the excess liquid. Put the dry potatoes and onions in
      a bowl and season with salt and pepper. Fold in the egg whites and chives to
      bind the mixture together.
  - step: Heat a large non-stick skillet over medium heat and coat with 1/4-inch of
      oil. For each pancake, take about 2 tablespoons of the potato mixture and drop
      into the hot oil; gently flatten with a spatula so they fry up thin and crispy.
      Fry for 3 to 4 minutes on each side, until golden. Remove to paper towels to
      drain; season with salt while the potato pancakes are still hot. Continue frying,
      adding more oil as needed, until all of the mixture is used up. Serve immediately
      with applesauce, if desired.
