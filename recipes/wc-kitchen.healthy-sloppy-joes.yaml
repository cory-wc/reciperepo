steps:
- step: In a large saucepan or skillet, sauté ground beef in 1 tablespoon of olive
    oil over medium heat, breaking it up as it cooks. Once the meat has browned, add
    the carrots, celery, bell peppers, onion, and salt. Cook, stirring occasionally,
    until the vegetables are beginning to soften, about 5–8 minutes. If the mixture
    seems dry at any point you can add another drizzle of olive oil.
- step: Add the minced garlic and cook for another minute or two, stirring occasionally.
- step: Add brown sugar, vinegar, Worcestershire sauce, tomato sauce, ketchup, and
    beef broth to the meat and vegetable mixture. Stir to combine. Simmer over medium-low
    heat, partially covered, stirring occasionally, about 20 minutes until the vegetables
    are tender. If the sauce gets too thick you can add another splash of beef broth
    and/or water. If the sauce is thinner than you like you can simmer it uncovered
    and the extra liquid should cook off.
- step: Season to taste with salt and pepper. Scoop the sloppy joes into split buns
    or baked potatoes and serve.
notes:
- Serve on soft buns, open-face on half a bun, in a baked russet or sweet potato,
  or on its own.
