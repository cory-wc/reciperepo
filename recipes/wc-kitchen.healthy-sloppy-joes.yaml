recipe_uuid: wc-kitchen.healthy-sloppy-joes
recipe_name: Healthy Sloppy Joes
description: These Healthy Sloppy Joes are made with lean ground beef and hidden veggies.
  This is a healthy and flavorful take on the classic sandwich.
source_authors:
- Allison - Celebrating Sweets
yields:
- amount: 6
  unit: servings
ingredients:
- extra virgin olive oil:
    amounts:
    - amount: 1
      unit: tablespoon
- lean ground beef:
    amounts:
    - amount: 1
      unit: pound
- celery:
    amounts:
    - amount: 0.75
      unit: cup
    processing:
    - finely chopped
- carrots:
    amounts:
    - amount: 0.75
      unit: cup
    processing:
    - finely chopped
- green bell pepper:
    amounts:
    - amount: 0.5
      unit: cup
    processing:
    - finely chopped
- yellow or red onion:
    amounts:
    - amount: 0.5
      unit: cup
    processing:
