steps:
- step: Cut or tear the bread into small bite-sized pieces and leave it out overnight
    to dry out or lightly toast it on a sheet pan in a 350°F oven for 10 minutes.
- step: Dice the onion and celery, mince the garlic, sage, and thyme, and chop up
    the mushrooms. Sauté the vegetables in the butter for 5 to 6 minutes to soften
    them up.
- step: In a small bowl whisk the eggs, stock, milk, salt, and pepper together.
- step: In a large bowl combine the bread, onion, and egg mixtures and let everything
    sit for 5 minutes, so the bread has time to absorb some of the liquid.
- step: Pour everything into a lightly greased baking dish and bake in a 350°F oven
    for 40 to 45 minutes.
- step: The stuffing is done when everything is nicely browned and crispy on top.
