author: Toni Dash
X-category: Side Dish
X-tags:
- cilantro lime rice
- instant pot rice recipe
- pressure cooker
X-active_time: 5 minutes
X-cook_time: 3 minutes
X-total_time: 18 minutes
X-nutrition:
  calories: 270 kcal
  serving_size: 1 cup
yields:
- amount: 5
  unit: 1-cup servings
ingredients:
- long grain white rice:
    amounts:
    - amount: 2
      unit: cups
    processing:
    - rinsed until water runs clear
- water:
    amounts:
    - amount: 2
      unit: cups
- lime zest:
    amounts:
    - amount: 1
      unit: lime
    notes: zest of 1 lime
- fresh cilantro:
    amounts:
    - amount: 0.333
      unit: cup
    processing:
    - chopped
- freshly squeezed lime juice:
    amounts:
    - amount: 2
      unit: teaspoons
    notes: optional
- vegetable oil:
    amounts:
    - amount: 1
      unit: teaspoon
    notes: optional; 1-2 teaspoons
steps:
- step: Place the rinsed rice in the Instant Pot insert. Pour in the water.
- step: Seal the lid, move the pressure vent to SEALING, set the Instant Pot to MANUAL,
    HIGH PRESSURE and using the '+/-' buttons set 3 minutes cooking time.
- step: When the cooking time is complete, allow a SLOW RELEASE for 10 minutes.
- step: After 10 minutes release the remaining pressure. Fluff the rice with the plastic
    rice paddle that came with the Instant Pot (or a spatula).
- step: Stir in the lime zest and chopped cilantro. Taste; add lime juice and/or oil
    as desired. Serve immediately.
