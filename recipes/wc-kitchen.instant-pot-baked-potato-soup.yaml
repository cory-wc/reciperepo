steps:
- step: Add potatoes and chicken broth to an Instant Pot. Seal the lid and cook on
    manual or soup setting for 10 minutes.
- step: Release pressure by turning the valve from sealing to venting. Mash potatoes
    to desired texture with a potato masher or large fork, or blend for a smoother
    soup.
- step: Add butter, cream cheese, sour cream, and cheddar cheese. Stir well to combine.
    Add salt and pepper and adjust to taste.
- step: Add milk or heavy cream as needed to reach desired consistency.
- step: Heat bacon bits in microwave for 30 to 60 seconds until crispy. Serve soup
    topped with bacon bits, green onion, and additional cheddar as desired.
