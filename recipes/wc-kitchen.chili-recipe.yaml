steps:
- step: Add onion, bell pepper, jalapeno pepper, and garlic to frying pan; cook and
    stir for 5 minutes until tender.
- step: Add remaining ingredients to slow cooker, mix well and cook for 4–5 hours
    on low.
- step: Garnish with sour cream and cheese.
notes:
- 'Cook''s note: I put a tablespoon instead of teaspoon of the spices in, because
  I doubled the bell peppers and those made most of the mix. I also put in 3 tablespoons
  of fresh jalapenos including seeds.'
- Handwritten additions to the printed recipe: 1 tsp salt, 1 can black beans.
- Chili flakes and jalapeno peppers are listed as alternatives (2 tbsp of either).
- Optional garnishes: sour cream, shredded cheddar.
