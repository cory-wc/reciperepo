recipe_uuid: wc-kitchen.chili-recipe
recipe_name: Chili
ingredients:
- onion:
    amounts:
    - amount: 1
      unit: whole
- red bell peppers:
    amounts:
    - amount: 2
      unit: whole
    processing:
    - chopped
- garlic:
    amounts:
    - amount: 3
      unit: cloves
- red pepper flakes:
    amounts:
    - amount: 2
      unit: teaspoons
    notes: or substitute 2 tbsp minced jalapeno peppers
- carrots:
    amounts:
    - amount: 2
      unit: whole
    processing:
    - diced
- frozen corn:
    amounts:
    - amount: 1.5
      unit: cups
    processing:
    - defrosted
- crushed tomatoes:
    amounts:
    - amount: 1
      unit: can
- kidney beans:
    amounts:
    - amount: 1
      unit: can
- black beans:
    amounts:
    - amount: 1
      unit: can
- sugar:
    amounts:
    - amount: 1
      unit: teaspoon
- ground cumin:
    amounts:
    - amount: 1
      unit: tablespoon
- chili powder:
    amounts:
    - amount: 1
      unit: tablespoon
- salt:
    amounts:
    - amount: 1
      unit: teaspoon
steps:
- step: Add onion, bell pepper, jalapeno pepper, and garlic to frying pan; cook and
    stir for 5 minutes until tender.
- step: Add remaining ingredients to slow cooker, mix well and cook for 4–5 hours
    on low.
notes:
- Optional garnishes: sour cream, shredded cheddar.
