recipe_uuid: wc-kitchen.pasta-e-piselli
recipe_name: Pasta e Piselli (Pasta with Peas)
description: 'Pasta e Piselli (pasta with peas) is a delicious, one-pot meal that
  has been loved by Italians and Italian Americans for generations. Made with just
  a few ingredients, this simple pasta dish, with its creamy texture and sweet peas,
  is sure to bring smiles to your dinner table.

  '
source_authors:
- Chef Dennis Littley
yields:
- amount: 8
  unit: servings
ingredients:
- ditalini pasta:
    amounts:
    - amount: 1
      unit: lbs
    notes: or other small shape pasta
- extra virgin olive oil:
    amounts:
    - amount: 0.5
      unit: cups
- sweet onion:
    amounts:
    - amount: 1
      unit: whole
    notes: large
    processing:
    - finely diced
- garlic:
    amounts:
    - amount: 1
      unit: cloves
    processing:
    - finely diced
- red pepper flakes:
    amounts:
    - amount: 0.25
      unit: teaspoons
- water:
    amounts:
    - amount: 4
      unit: cups
    notes: more as needed
- salt:
    amounts:
    - amount: 1
      unit: teaspoons
- black pepper:
    amounts:
    - amount: 0.25
      unit: teaspoons
- baby peas:
    amounts:
    - amount: 14–16
