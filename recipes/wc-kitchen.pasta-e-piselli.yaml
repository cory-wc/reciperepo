steps:
- step: Add the olive oil and chopped onions to a large pan over medium-high heat.
- step: Cook the onions until soft (4–5 minutes). Don't let the onions brown.
- step: Add the chopped garlic and red pepper flakes to the onions and continue to
    cook for 1 minute. Add the water, salt, and baby peas to the onion mixture and
    bring to a boil (used frozen peas).
- step: Once boiling, remove some of the peas and mash them with a large spoon or
    fork.
- step: Add the pasta and mashed peas to the pot and reduce the heat to medium heat.
    Let the pasta cook per instructions on the package for al dente. Stir the mixture
    often to keep it from sticking.
- step: If the pasta isn't fully cooked, add more water until the pasta is cooked
    to the desired doneness. When the pasta has reached al dente, remove the pot from
    the stove and mix in the cheese and chopped parsley.
- step: Taste and season the pasta with peas to taste with salt and black pepper.
    If the pasta seems dry, add a little water to loosen it up.
- step: Serve the pasta with additional grated cheese, black pepper, and crusty bread.
notes:
- Traditionally ditalini is used, but other small pasta shapes such as small shells,
  farfalle, pennette, elbow macaroni, and orzo can also be used.
- If you're not a fan of peas or want to add additional vegetables, asparagus, spinach,
  grape tomatoes, broccoli, broccolini, and red peppers would make nice additions.
  Cut into small pieces to keep the style consistent.
- Chicken broth or vegetable broth can be used instead of water for a more flavorful
  dish, or use half water and half broth. Cut back on the salt if using broth.
- Parsley is mentioned in step 6 but not listed in the ingredients.
