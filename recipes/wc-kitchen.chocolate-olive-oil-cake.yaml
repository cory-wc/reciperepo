ingredients:
- name_group: Cake
- all-purpose flour:
    amounts:
    - amount: 1.5
      unit: cups
    notes: 195 grams
- unsweetened cocoa:
    amounts:
    - amount: "3/4"
      unit: cups
    notes: 60 grams; any variety, sifted if lumpy
- baking soda:
    amounts:
    - amount: 1.5
      unit: teaspoons
- fine sea salt:
    amounts:
    - amount: "1/2"
      unit: teaspoons
- granulated sugar:
    amounts:
    - amount: "3/4"
      unit: cups
    notes: 150 grams
- dark brown sugar:
    amounts:
    - amount: "3/4"
      unit: cups
    notes: 145 grams
- olive oil:
    amounts:
    - amount: "1/2"
      unit: cups
    notes: 120 ml
- water or coffee:
    amounts:
    - amount: 1.5
      unit: cups
    notes: 355 ml
- cider vinegar:
    amounts:
    - amount: 1
      unit: tablespoons
    notes: 15 ml; or white vinegar
- name_group: Glaze
- semisweet chocolate chips:
    amounts:
    - amount: "3/4"
      unit: cups
    notes: 135 grams
- cocoa powder:
    amounts:
    - amount: 2
      unit: tablespoons
    notes: 10 grams
- olive oil (glaze):
    amounts:
    - amount: 3
      unit: tablespoons
    notes: 45 ml
- light corn syrup:
    amounts:
    - amount: 1
      unit: tablespoons
    notes: 20 grams; for shine
- flaky sea salt:
    amounts: []
    notes: pinch or two

steps:
- step: Heat oven to 350°F. Line the bottom of a 9-inch round cake pan with a fitted
    round of parchment paper and coat the bottoms and sides with oil.
- step: In a large bowl, whisk together flour, cocoa, baking soda, salt, and sugars.
    Add olive oil, water or coffee, and vinegar. Whisk until smooth.
- step: Pour batter into prepared pan and bake 35 to 40 minutes, until a toothpick
    inserted in the center comes out clean. Let cool in pan for 10 minutes, then transfer
    to a wire rack to cool completely.
- step: Make glaze — in a microwave-safe bowl, melt chocolate chips, then whisk in
    cocoa powder, olive oil, and corn syrup until smooth. Pour over cooled cake and
    sprinkle with flaky sea salt.
