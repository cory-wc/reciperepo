recipe_uuid: wc-kitchen.creamy-tortellini-soup
recipe_name: Creamy Tortellini Soup
description: My favorite cozy weeknight soup made in just 30 min! It's so stinking
  easy too. Loaded with tender tortellini, sausage and kale!
source_url: https://damndelicious.net/2019/01/30/creamy-tortellini-soup/
