recipe_uuid: wc-kitchen.sparkling-apple-cider-gin-cocktail
recipe_name: Sparkling Apple Cider Gin Cocktail
description: Refreshing, simple, and easy holiday beverage with just 4 ingredients.
  Cheers to that!
source_url: https://www.aberdeenskitchen.com/2020/11/sparkling-apple-cider-gin-cocktail/
source_authors:
- Aberdeen
yields:
- amount: 1
  unit: serving
ingredients:
- gin:
    amounts:
    - amount: 1.5
      unit: oz
- lemon juice:
    amounts:
    - amount: 1
      unit: teaspoons
    notes: freshly squeezed
- orange bitters:
    amounts:
    - amount: 1
      unit: dash
- sparkling apple cider:
    amounts: []
    notes: to top; Martinelli's recommended
steps:
- step: 'Optional: To rim your glasses, pour 1 tablespoon of white sugar and 1 tablespoon
    of cinnamon onto a plate and spread to cover. Moisten the edge of each glass with
    a lemon wedge and dip into the sugar plate.'
- step: In a cocktail shaker, shake together gin, lemon juice, and orange bitters.
- step: Strain into rimmed glasses over ice. Top with sparkling apple cider and a
    sprig of thyme to garnish. Serve immediately.
