recipe_uuid: wc-kitchen.moist-chocolate-cake
recipe_name: Moist Chocolate Cake
description: 'This moist chocolate cake with chocolate fudge frosting is a decadent
  dessert with a soft, rich crumb complemented by a creamy, luscious topping.

  '
source_authors:
- Angelina Papanikolaou
yields:
- amount: 12
  unit: servings
ingredients:
- all-purpose flour:
    amounts:
    - amount: 2
      unit: cups
- granulated sugar:
    amounts:
    - amount: 1 1/3
      unit: cups
- brown sugar:
    amounts:
    - amount: 1
      unit: cups
- cocoa powder:
    amounts:
    - amount: 1
      unit: cups
- baking soda:
    amounts:
    - amount: 2.5
      unit: teaspoons
- baking powder:
    amounts:
    - amount: 2
      unit: teaspoons
- salt:
    amounts:
    - amount: 1
      unit: teaspoon
- buttermilk:
    amounts:
    - amount: 1.25
      unit: cups
    notes: room temperature
- coffee:
    amounts:
    - amount: 0.75
      unit: cups
    notes: room temperature
- vegetable oil:
    amounts:
    - amount: 2/3
      unit: cups
- eggs:
    amounts:
    - amount: 3
      unit: whole
    notes: room temperature
- vanilla extract:
    amounts:
    - amount: 1
      unit: tablespoon
- name_group: Frosting
- unsalted butter:
    amounts:
    - amount: 2
      unit: cups
    notes: room temperature
- powdered sugar:
    amounts:
    - amount: 2
      unit: cups
- cocoa powder:
    amounts:
    - amount: 1
      unit: cups
- salt:
    amounts:
    - amount: 0.5
      unit: teaspoons
- chocolate chips:
    amounts:
    - amount: 2
      unit: cups
- honey:
    amounts:
    - amount: 0.25
      unit: cups
- heavy cream:
    amounts:
    - amount: 0.25
      unit: cups
- vanilla extract:
    amounts:
    - amount: 1
      unit: teaspoon
steps:
- step: Preheat oven to 350°F (175°C). Grease 3 8-inch round cake pans and line the
    bottoms with parchment paper.
- step: In a large bowl, whisk together the flour, granulated sugar, brown sugar,
    cocoa powder, baking soda, baking powder, and salt.
- step: In another bowl, whisk together the buttermilk, coffee, oil, eggs, and vanilla
    extract.
- step: Add the wet ingredients to the dry ingredients and mix until combined. Make
    sure there are no pockets of flour but avoid overmixing.
- step: Divide the batter equally between the prepared cake pans. Tap the pans on
    the countertop to remove any air bubbles. Bake for 25–30 minutes or until a toothpick
    inserted into the center comes out with a few crumbs.
- step: Remove the cakes from the oven and allow them to cool in the pans for 10 minutes
    before removing and transferring to wire racks to cool completely.
- step: 'Fudge Frosting: In a microwave-safe bowl or using a double boiler, melt the
    chocolate chips, honey, and heavy cream. Cool slightly.'
- step: In a large mixing bowl or stand mixer fitted with the paddle attachment, beat
    the butter until smooth and creamy.
- step: Add the powdered sugar, cocoa powder, and salt. Beat to combine.
- step: Add the melted chocolate mixture and vanilla to the frosting and beat until
    smooth and creamy.
- step: 'Assemble: Place one cake layer on a serving platter. Spread a generous amount
    of frosting on top. Place the second cake layer on top and spread a layer of frosting.
    Add the final cake layer and frost the top and sides with the remaining frosting.'
- step: Optional — decorate with chocolate shavings, sprinkles, or anything else you
    like.
notes:
- 'Store: Wrap leftover cake in plastic wrap or place in an airtight container. Refrigerate
  for up to a week.'
- 'Freeze: Place cake uncovered in the freezer for 1 hour, then wrap with plastic
  wrap and aluminum foil. Freeze for up to 3 months. Thaw in the refrigerator overnight
  or at room temperature.'
- 'Make ahead: Cake layers can be prepared a day ahead. Once cooled, wrap unfrosted
  layers in plastic wrap. Refrigerate for up to 3 days or freeze for up to 3 months.
  Prepare frosting on the day of assembly.'
equipment:
- 3 8-inch round cake pans
- parchment paper
- mixing bowls
- stand mixer or hand held mixer
