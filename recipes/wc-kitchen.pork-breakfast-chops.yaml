steps:
- step: Salt and pepper both sides of the pork chops.
- step: Combine the flour and some cayenne, salt and black pepper. Dredge each side
    of the pork chops in the flour mixture, and then set aside on a plate.
- step: Heat the canola oil over medium to medium-high heat. Add the butter. When
    the butter is melted and the butter/oil mixture is hot, cook 3 pork chops at a
    time, 2 to 3 minutes on the first side. Flip and cook until the chops are golden
    brown on the other side, 1 to 2 minutes (make sure no pink juices remain). Remove
    to a plate and repeat with the remaining pork chops.
- step: Delicious and simple! Serve with smashed new potatoes.
