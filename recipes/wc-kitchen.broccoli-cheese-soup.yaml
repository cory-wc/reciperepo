recipe_name: Broccoli Cheese Soup
source_url: https://www.allrecipes.com
X-original-source: ../originals/PXL_20260523_110723711.RAW-01.COVER.jpg
description: 'This is a great, very flavorful soup. Good for serving at luncheons
  or special gatherings with a quiche. To make this soup a little fancier, add 1 cup
  sliced mushrooms and 1 cup white wine with the onions.

  '
