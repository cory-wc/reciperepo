recipe_uuid: wc-kitchen.quick-pickled-red-onion
recipe_name: Quick Pickled Red Onion
author: Naz Deravian
yields:
- amount: 2
  unit: cups
  note: with pickling liquid
X-total_time: 50 minutes
X-active_time: 5 minutes
X-cook_time: 45 minutes
ingredients:
- red onion:
    amounts:
    - amount: 1
      unit: large
- kosher salt:
    amounts:
    - amount: 2
      unit: teaspoon
    note: such as Diamond Crystal
- granulated sugar:
    amounts:
    - amount: 2
      unit: teaspoon
- vinegar:
    amounts:
    - amount: 0.75
      unit: cup
    note: white or red wine, distilled or apple cider
- water:
    amounts:
    - amount: 0.25
      unit: cup
steps:
- step: Thinly slice the red onion by halving through the root and slicing in the
    same direction. Separate the slices by hand, as best you can, without getting
    too obsessive. Place the onion slices in a heat-proof, wide-mouth jar or container
    (about 1 pint capacity). It might seem like they won't fit, but the onion slices
    will shrink as they pickle.
- step: Add the salt, sugar, vinegar and 1/4 cup water to a small saucepan. Heat over
    medium-high, stirring to dissolve the salt and sugar. As soon as the mixture comes
    to a boil, remove from the heat and pour half of the liquid over the onion, pressing
    down the slices with the back of a spoon. Add the remaining liquid, continuing
    to press down the slices.
- step: Cover and give the jar a gentle shake. Set aside to pickle for about 30 minutes.
    Serve right away, or cool to room temperature and place in the fridge in the pickling
    liquid, covered, for up to 1 week.
