recipe_uuid: wc-kitchen.potato-leek-soup
recipe_name: Potato Leek Soup
description: A French classic, this creamy potato leek soup is quick, easy, and delicious!
yields:
- amount: 6
  unit: servings
ingredients:
- unsalted butter:
    amounts:
    - amount: 3
      unit: tablespoon
- leeks, white and light green parts only, roughly chopped:
    amounts:
    - amount: 4
      unit: large
    notes: about 5 cups
- garlic, peeled and smashed:
    amounts:
    - amount: 3
      unit: clove
- Yukon Gold potatoes, peeled and roughly chopped into 1/2-inch pieces:
    amounts:
    - amount: 2
      unit: pound
- low sodium chicken or vegetable broth:
    amounts:
    - amount: 7
      unit: cup
- bay leaves:
    amounts:
    - amount: 2
      unit: leaf
- fresh thyme:
    amounts:
    - amount: 3
      unit: sprig
- salt:
    amounts:
    - amount: 1
      unit: teaspoon
- ground black pepper:
    amounts:
    - amount: 0.25
      unit: teaspoon
- heavy cream:
    amounts:
    - amount: 1
      unit: cup
- chives, finely chopped:
    amounts: []
    notes: for serving
steps:
- step: Melt the butter over medium heat in a large soup pot. Add the leeks and garlic
    and cook, stirring regularly, until soft and wilted, about 10 minutes. Adjust
    the heat as necessary so as not to brown.
- step: Add the potatoes, broth, bay leaves, thyme, salt and pepper to pot and bring
    to a boil. Cover and turn the heat down to low. Simmer for 15 minutes, or until
    the potatoes are very soft.
- step: Fish out the thyme sprig and bay leaves, then purée the soup with a hand-held
    immersion blender until smooth. (Alternatively, use a standard blender to purée
    the soup in batches; see note.) Add the heavy cream and bring to a simmer. Taste
    and adjust seasoning with salt and pepper. If soup is too thin, simmer until thickened.
    If it's too thick, add water or stock to thin it out. Garnish with fresh herbs
    if desired.
notes:
- 'If using a standard blender to purée the soup: be sure not to fill the jar more
  than halfway; leave the hole in the lid open and cover loosely with a dishtowel
  to allow the heat to escape; and pour blended soup into a clean pot.'
- 'Freezer-Friendly Instructions: The soup can be frozen, without the cream, for up
  to 3 months. Defrost the soup in the refrigerator for 12 hours and then reheat it
  on the stovetop over medium heat until hot. Once heated through, add the cream and
  bring to a simmer before serving.'
