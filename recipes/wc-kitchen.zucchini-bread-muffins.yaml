steps:
- step: Preheat oven to 425°F (218°C). Spray a 12-count muffin pan with nonstick spray
    or line with cupcake liners.
- step: Whisk the flour, baking powder, baking soda, salt, cinnamon, and nutmeg together
    in a large bowl. Set aside.
- step: In a medium bowl, whisk the oil, granulated sugar, brown sugar, eggs, vanilla
    extract, and milk together.
- step: Whisk in the shredded zucchini. Pour the wet ingredients into the dry ingredients
    and mix until just combined.
- step: Fold in the chocolate chips, if using. Spoon the batter into the prepared
    muffin cups, filling them all the way to the top. Top each with a sprinkle of
    coarse sugar, if desired.
- step: Bake for 5 minutes at 425°F (218°C), then — keeping the muffins in the oven
    — reduce the oven temperature to 350°F (177°C). Bake for an additional 15–16 minutes,
    or until a toothpick inserted in the center comes out clean.
