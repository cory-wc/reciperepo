recipe_uuid: wc-kitchen.tzatziki
recipe_name: Tzatziki
description: 'Tzatziki is a popular Greek sauce traditionally served with souvlaki
  and pita bread, but it''s super versatile in its potential: It''s a great snacking
  dip with crudités and chips, as well as a bright and tangy sauce to drizzle on grain
  bowls or serve alongside roasted chicken or salmon. Most commonly finished with
  dill, tzatziki is sometimes made — and equally delicious — with other fresh herbs,
  like mint or oregano. It can be made a few hours ahead and will keep in the refrigerator
  for up to 3 days.

  '
source_authors:
- Kay Chun
yields:
- amount: 2.5
  unit: cups
ingredients:
- Persian cucumbers:
    amounts:
    - amount: 3
      unit: whole
- plain whole-milk Greek yogurt:
    amounts:
    - amount: 2
      unit: cups
- dill:
    amounts:
    - amount: 2
      unit: tablespoons
    processing:
    - finely chopped
- lemon juice:
    amounts:
    - amount: 1
      unit: tablespoon
- garlic:
    amounts:
    - amount: 1
      unit: cloves
    processing:
    - minced
steps:
- step: 'Using the large holes of a box grater, grate cucumbers. Using your hands,
    squeeze grated cucumbers to remove excess water, then place cucumbers in a medium
    bowl (you should have about 1 cup).

    '
- step: 'Add yogurt, dill, lemon juice and garlic; season with salt and pepper to
    taste. Mix well.

    '
