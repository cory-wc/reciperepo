recipe_uuid: wc-kitchen.cucumber-salad
recipe_name: Cucumber Salad
yields:
- amount: 4
  unit: people
X-total_time: 25 minutes
ingredients:
- cucumbers, thinly sliced:
    amounts:
    - amount: 1
      unit: lb
- sugar:
    amounts:
    - amount: 1.5
      unit: tsp
- salt:
    amounts:
    - amount: 1.5
      unit: tsp
- red wine vinegar:
    amounts:
    - amount: 2.5
      unit: tsp
- small red onion, thinly sliced:
    amounts:
    - amount: 0.5
      unit: whole
steps:
- step: Toss cucumber slices with salt and sugar.
- step: Stir in vinegar and onion. Refrigerate for 10 minutes, then serve.
