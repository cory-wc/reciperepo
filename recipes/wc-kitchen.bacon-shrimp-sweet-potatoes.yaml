recipe_uuid: wc-kitchen.bacon-shrimp-sweet-potatoes
recipe_name: Bacon-Shrimp Sweet Potatoes

yields:
  - amount: 4
    unit: servings

ingredients:
  - sweet potatoes:
      amounts:
        - amount: 8
          unit: whole

  - shrimp:
      amounts:
        - amount: 1
          unit: pounds
      notes: large; raw
      processing:
        - deveined
        - tails removed
        - cut into thirds

  - bacon:
      amounts:
        - amount: 6
          unit: slices
      processing:
        - cooked
        - crumbled

  - garlic:
      amounts:
        - amount: 4
          unit: cloves
      processing:
        - crushed

  - green onions:
      amounts:
        - amount: 4
          unit: whole
      processing:
        - thinly sliced

  - paprika:
      amounts:
        - amount: 1
          unit: tablespoon

  - chili powder:
      amounts:
        - amount: 2
          unit: tablespoons

  - dried oregano:
      amounts:
        - amount: 1
          unit: tablespoon

  - cayenne:
      amounts:
        - amount: "1/2"
          unit: teaspoon

  - butter:
      amounts:
        - amount: 6
          unit: tablespoons

  - olive oil:
      amounts:
        - amount: 2
          unit: tablespoons

steps:
  - step: Preheat oven to 450°F.
  - step: Rub potatoes with olive oil. Place them on a baking sheet and bake for 40-45 minutes or until soft.
  - step: While the potatoes are baking, melt butter in skillet and add the garlic and green onions (reserve some sliced green onions for garnishing). Cook about 2 minutes.
  - step: Add the shrimp to the skillet. Cook for 2-3 minutes. Add the paprika, chili powder, dried oregano, and cayenne. Stir and cook until shrimp are done, about 2 more minutes.
  - step: When the potatoes are done, let them cool. Leave the oven on.
  - step: Slice the potatoes in half horizontally and scoop out the flesh into a big bowl.
  - step: Mash the sweet potatoes until smooth.
  - step: Add the crumbled bacon and shrimp mixture (including the butter from the skillet). Combine everything well.
  - step: Serve in a bowl and sprinkle with green onions.

X-total_time: 100 minutes
