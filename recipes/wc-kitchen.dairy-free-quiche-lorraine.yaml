recipe_name: Dairy Free Quiche Lorraine
description: 'Made with oat milk, smoky bacon and caramelized shallots, this dairy
  free quiche is everything you''ve been missing - flaky, tender crust with a delicate
  and creamy egg filling. Serve it for a classic dairy free brunch, or enjoy it as
  a light dinner alongside a simple green salad.'
