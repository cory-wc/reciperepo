steps:
- step: Preheat oven to 375°F.
- step: Roll a prepared pie crust into a 9-inch pie plate and pierce the bottom with
    a fork. Using pie weights, blind bake the crust for 10 minutes. Remove from the
    oven and allow the crust to cool before filling.
- step: In a large skillet, heat olive oil and add shallots. Allow them to caramelize,
    stirring as needed, until golden brown and completely softened.
- step: In a large mixing bowl, whisk the eggs, dairy free milk, nutritional yeast,
    salt and nutmeg together until smooth.
