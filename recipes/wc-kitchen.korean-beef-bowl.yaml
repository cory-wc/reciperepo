recipe_uuid: wc-kitchen.korean-beef-bowl
recipe_name: Korean Beef Bowl
source_url: https://damndelicious.net/2013/07/07/korean-beef-bowl/
X-original-source: ../originals/PXL_20260523_110326010.RAW-01.COVER.jpg
description: Tastes like Korean BBQ and is on your dinner table in just 15 min from
  start to finish! Seriously. It doesn't get any easier than this!
yields:
- amount: 4
  unit: servings
X-active_time: 5 minutes
X-cook_time: 10 minutes
X-total_time: 15 minutes
ingredients:
- brown sugar:
    amounts:
    - amount: 0.25
      unit: cups
    notes: packed
- reduced sodium soy sauce:
    amounts:
    - amount: 0.25
      unit: cups
- sesame oil:
    amounts:
    - amount: 2
      unit: teaspoons
- crushed red pepper flakes:
    amounts:
    - amount: 0.5
      unit: teaspoons
    notes: or more to taste
- ground ginger:
    amounts:
    - amount: 0.25
      unit: teaspoons
- vegetable oil:
    amounts:
    - amount: 1
      unit: tablespoon
- garlic:
    amounts:
    - amount: 3
      unit: cloves
    processing:
    - minced
- ground beef:
    amounts:
    - amount: 1
      unit: pound
- onion:
    amounts:
    - amount: 0.5
      unit: whole
    processing:
    - diced
- green onions:
    amounts:
    - amount: 2
      unit: whole
    processing:
    - thinly sliced
- sesame seeds:
    amounts:
    - amount: 0.25
      unit: teaspoons
    notes: for garnish

steps:
- step: In a small bowl, whisk together brown sugar, soy sauce, sesame oil, red pepper
    flakes and ginger.
- step: Heat vegetable oil in a large skillet over medium high heat. Add garlic and
    cook, stirring constantly, until fragrant, about 1 minute. Add ground beef and
    cook until browned, about 3-5 minutes, making sure to crumble the beef as it cooks;
    drain excess fat.
- step: Stir in soy sauce mixture and green onions until well combined, allowing to
    simmer until heated through, about 2 minutes.
- step: Serve immediately, garnished with green onion and sesame seeds, if desired.

notes:
- Handwritten additions: quick-pickled red onion and radish for topping.

