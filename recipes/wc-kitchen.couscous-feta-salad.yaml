steps:
- step: Boil water and 1 tbsp olive oil. Add couscous, stir, remove from heat, cover,
    and let sit 10 minutes.
- step: While couscous is cooking, cut cucumber, tomatoes, and onion into 1/2 - 1"
    cubes.
- step: Whisk together olive oil, vinegar, salt, and pepper.
- step: Toss couscous, feta, vegetables, and dressing. Chill for 20 minutes.
