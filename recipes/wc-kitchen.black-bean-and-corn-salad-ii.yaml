X-active_time: 25 minutes
X-total_time: 25 minutes
ingredients:
- fresh lime juice:
    amounts:
    - amount: 0.333
      unit: cup
- olive oil:
    amounts:
    - amount: 0.5
      unit: cup
- garlic:
    amounts:
    - amount: 1
      unit: clove
    processing:
    - minced
- salt:
    amounts:
    - amount: 1
      unit: teaspoon
- ground cayenne pepper:
    amounts:
    - amount: 0.125
      unit: teaspoon
- black beans:
    amounts:
    - amount: 2
      unit: cans
    notes: 15-ounce cans
    processing:
    - rinsed
    - drained
- frozen corn kernels:
    amounts:
    - amount: 1.5
      unit: cup
- avocado:
    amounts:
    - amount: 1
      unit: whole
    processing:
    - peeled
    - pitted
    - diced
- red bell pepper:
    amounts:
    - amount: 1
      unit: whole
    processing:
