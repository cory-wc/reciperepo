steps:
- step: 'For the salmon: Flake the salmon apart. Mix all burger ingredients together
    and form into 3 large or 4 patties. Fry the burgers in a nonstick skillet over
    medium heat, ideally with a little olive oil, for a few minutes on each side until
    golden brown and crispy. Place on a paper towel lined plate and sprinkle with
    salt.'
- step: 'For the slaw: Mix all slaw ingredients together. Taste and adjust.'
- step: 'Serve: Serve up those hot salmon burgers on a bed of creamy slaw. Top with
    a dollop of extra Greek yogurt and a swirl of olive oil and more herbs.'
notes:
- Olive oil for pan-frying burgers and a drizzle for the slaw (amounts unspecified).
- Serve on soft buns or open-face on half a bun.
