recipe_uuid: wc-kitchen.the-best-meatloaf-recipe-of-your-life
recipe_name: The Best Meatloaf Recipe Of Your Life
X-original-source: ../originals/PXL_20260523_105740798.RAW-01.COVER.jpg
X-prep_time: 15 minutes
X-total_time: 75 minutes

yields:
- amount: 8
  unit: servings

ingredients:
- fresh breadcrumbs:
    amounts:
    - amount: 1
      unit: cups
- whole milk:
    amounts:
    - amount: "2/3"
      unit: cups
- olive oil:
    amounts:
    - amount: 2
      unit: tablespoons
- onion:
    amounts:
    - amount: 1
      unit: whole
    notes: large
    processing:
    - finely chopped
- salt:
    amounts:
    - amount: "2 1/2"
      unit: teaspoons
    notes: coarse
- garlic:
    amounts:
    - amount: 3
      unit: cloves
    notes: large
- ketchup:
    amounts:
    - amount: "1/4"
      unit: cups
    - amount: 1
      unit: cups
    notes: divided (1/4 cup for meat mixture, 1 cup for glaze)
- Worcestershire sauce:
    amounts:
    - amount: 6
      unit: tablespoons
    notes: divided equally between meat mixture and glaze
- parsley:
    amounts:
    - amount: 2
      unit: tablespoons
    notes: fresh; or 2 teaspoons dried
    processing:
    - minced
- black pepper:
    amounts:
    - amount: "1 1/4"
      unit: teaspoons
- eggs:
    amounts:
    - amount: 2
      unit: whole
    notes: large
- ground beef:
    amounts:
    - amount: 1
      unit: lbs
- ground pork:
    amounts:
    - amount: 1
      unit: lbs
- garlic powder:
    amounts:
    - amount: 1
      unit: teaspoons
- onion powder:
    amounts:
    - amount: 2
      unit: teaspoons
- mustard powder:
    amounts:
    - amount: 1
      unit: teaspoons
- celery seeds:
    amounts:
    - amount: "1/2"
      unit: teaspoons
- molasses:
    amounts:
    - amount: "1 1/2"
      unit: tablespoons
- prepared horseradish:
    amounts:
    - amount: 1
      unit: teaspoons

steps:
- step: In a large bowl, stir together breadcrumbs and milk; let stand to absorb. Line
    a baking sheet with parchment paper or aluminum foil. Preheat oven to 350°F.
- step: Heat olive oil in a large saucepan over medium heat, then cook onion with 1
    teaspoon salt until softened, about 7 minutes. Add garlic and cook until fragrant,
    about a minute more. Cool for a few minutes, then scrape into breadcrumb mixture.
- step: Stir 1/4 cup ketchup into the breadcrumb mixture along with 3 tablespoons
    Worcestershire sauce, parsley, garlic powder, onion powder, mustard powder, celery
    seeds, remaining salt, and pepper. When mixture is cool to the touch, stir in the
    eggs then the ground meat. Use your hands to gently but thoroughly work the mixture
    together.
- step: Scrape the meat mixture onto the prepared pan and shape into roughly a 9x5
    loaf.
- step: Whisk together 1 cup ketchup, 3 tablespoons Worcestershire sauce, 1 1/2 tablespoons
    molasses, and 1 teaspoon prepared horseradish for the sauce. Spread evenly over
    the top of the loaf.
- step: Bake in center rack of oven for about 1 hour, or until center reads 160°F.
    Allow meatloaf to rest on pan for 10 minutes before slicing.

notes:
- Ground pork can be omitted — just use 2 lbs total ground beef instead.

