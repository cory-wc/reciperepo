steps:
- step: Place radish slices in a Ball Flute Jar.
- step: Combine vinegar, sugar, water, salt, mustard seeds, spice, bay leaf, and (if
    using) crushed red pepper in a small stainless steel saucepan. Bring to a boil.
- step: Ladle hot brine over radishes in jar. Center lid on jar and apply band, adjusting
    to fingertip-tight. Let cool on a wire rack, about 1 hour. Chill for at least 6
    hours before serving. Store in refrigerator up to 4 months.
