steps:
- step: In a large bowl combine ground turkey, crushed crackers (or bread crumbs),
    buttermilk (or egg), green onions, garlic powder, salt, and pepper. Gently shape
    into 16–18 meatballs.
- step: Combine teriyaki sauce ingredients in a medium bowl (or use bottled teriyaki
    sauce as noted by handwritten annotation). Set aside.
- step: Heat the Instant Pot in sauté mode. Add 1 tablespoon of oil and brown the
    meatballs, about 2 minutes per side. When brown, add the teriyaki sauce, cover
    and lock the lid. Cook on high pressure for 10 minutes.
- step: After 10 minutes, turn off the pot and allow it to release pressure naturally.
    This will take about 5 minutes.
- step: Sprinkle with sliced green onions and sesame seeds. Serve with rice or quinoa.
notes:
- If you don't have saltine crackers available you can use 1/2 cup of plain panko
  or breadcrumbs.
- The original recipe uses buttermilk due to an egg allergy; if no food restriction,
  substitute buttermilk for 1 egg.
- Handwritten annotations cross out the saltine crackers and buttermilk, replacing
  with "1/4 cup bread crumbs" and "1 egg".
- The entire homemade teriyaki sauce section is crossed out with the handwritten note
  "from bottle", indicating bottled teriyaki sauce is used instead.
- Recipe is page 1 of 2; additional notes may appear on page 2.
