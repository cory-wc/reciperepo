recipe_uuid: wc-kitchen.pork-dumpling-burgers-with-sesame-special-sauce
recipe_name: Pork Dumpling Burgers with Sesame Special Sauce
description: Ginger-scallion pork patties with purple cabbage slaw and a spicy sesame mayo on brioche buns.
source_authors:
  - Mishka Makes Food
source_url: https://mishkamakesfood.substack.com/p/pork-dumpling-burgers-w-sesame-special

yields:
  - amount: 4
    unit: thick burgers
  - amount: 6
    unit: regular burgers

