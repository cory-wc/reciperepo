          unit: buns

steps:
  - Make the patties. Combine pork, soy sauce, sesame oil, scallions, ginger, garlic, and panko. Mix thoroughly by hand or stand mixer until sticky and cohesive but still fluffy. Form 4 thick patties, or 6-8 smaller ones.
  - Prepare the slaw. Toss cabbage with salt and sugar and massage until it softens and releases liquid. Rest 5-10 minutes, then drain. Add rice vinegar to taste and sesame seeds, and toss.
  - Make the sauce. Mix all sauce ingredients in a medium bowl. Adjust seasoning and refrigerate until needed.
  - Cook the patties. Heat a skillet or grill pan over medium heat with a light coating of oil. Sear until deeply browned on one side, flip, and continue cooking. Finish thick patties in a 375°F oven.
  - Assemble. Toast the buns. Spread sauce on the bottom bun, then add the patty, slaw, and top bun.

notes:
  - "Low-calorie swaps: ground chicken for pork, light mayo for regular, and either low-carb buns or 2 pieces of butter lettuce per burger in place of the bun."
  - "Macros per serving (1 large burger, 4 servings). Original: 1035 cal, 30 g protein, 80 g fat, 47 g carbs, 5 g fiber. Low-calorie with low-carb bun: 602 cal, 44 g protein, 32 g fat, 36 g carbs, 15 g fiber. Low-calorie with lettuce wrap: 514 cal, 37 g protein, 31 g fat, 23 g carbs, 4 g fiber."

