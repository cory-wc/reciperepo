  - ground pork:
      amounts:
        - amount: 1.5
          unit: lb
        - amount: 700
          unit: g
  - light soy sauce:
      amounts:
        - amount: 3
          unit: tbsp
        - amount: 45
          unit: ml
  - sesame oil:
      amounts:
        - amount: 1
          unit: tsp
        - amount: 5
          unit: ml
  - scallions, greens finely diced:
      amounts:
        - amount: 1
          unit: large bunch
  - fresh ginger, grated:
      amounts:
        - amount: 1
          unit: inch piece
        - amount: 3
          unit: cm
  - garlic, minced:
      amounts:
        - amount: 4
          unit: cloves
  - panko breadcrumbs:
      amounts:
        - amount: 0.5
          unit: cup
        - amount: 30
          unit: g
  - cooking spray:
      amounts:
