steps:
- step: Preheat the oven to 425 degrees.
- step: 'For the filling: Heat the oil in a small skillet over medium heat. Add the
    pepper flakes and grate the 3 cloves of garlic into the pan. Sauté until fragrant,
    about 30 seconds. Add the spinach and allow it to wilt, about 2 minutes. Sprinkle
    lightly with salt then remove the mixture from heat. Place the spinach mixture
    in a pan and squeeze gently (being careful as it''s hot) to release any excess
    moisture. Place the spinach in a small bowl and stir in chopped tomatoes and feta
    cheese. Set aside.'
- step: 'For the topping: Combine balsamic oil, mustard, rosemary, lemon zest, garlic,
    salt, and pepper in a small bowl and whisk until smooth. Set aside.'
- step: 'To assemble: Lay the pork tenderloin down the middle lengthwise, leaving
    just about a 1/2 inch intact on one side. Open the top half and lay it flat. Spread
    the spinach mixture evenly over the center of the loin. Fold the top half back
    in place with the butcher''s string to tie it together in 3-4 places.'
- step: Place the pork loin in a roasting pan then smear all sides with the topping.
- step: Roast the tenderloin at 425 degrees for 15 minutes then reduce heat to 375
    degrees and roast an additional 20-30 minutes or until a thermometer inserted
    in the thickest part of the loin reads at least 145 degrees. Allow the pork to
    rest for 10 minutes before slicing and serving.
- step: 'Notes: There are a few ways to stuff a pork tenderloin, but I find the easiest
    way is: 1. Slice the tenderloin in half lengthwise. 2. Spread the filling down
    the center. 3. Fold the meat over your filling and use some butcher string to
    tie the tenderloin together.'
