recipe_name: Baked Oatmeal With Cranberries and Almonds
source_url: https://www.realsimple.com
yields:
- amount: 1
  unit: 2-quart baking dish
ingredients:
- old-fashioned rolled oats:
    amounts:
    - amount: 2
      unit: cups
- unsalted butter:
    amounts:
    - amount: 0.25
      unit: cups
    notes: plus more for the pan
    processing:
    - melted
    - slightly cooled
- almonds:
    amounts:
    - amount: 0.75
      unit: cups
    processing:
    - toasted
    - chopped
- dried cranberries:
    amounts:
    - amount: 0.75
      unit: cups
- ground cinnamon:
    amounts:
    - amount: 1
      unit: teaspoon
- fine salt:
    amounts:
    - amount: 0.25
      unit: teaspoons
- whole milk:
    amounts:
    - amount: 1.75
      unit: cups
- eggs:
    amounts:
    - amount: 2
      unit: whole
    notes: large
    processing:
    - beaten
- pure maple syrup:
    amounts:
    - amount: 2/3
      unit: cups
- pure vanilla extract:
    amounts:
    - amount: 2
      unit: teaspoons
steps:
- step: Heat oven to 350°F.
- step: Butter a 2-quart baking dish.
- step: Combine the oats, almonds, cranberries, cinnamon, and ¼ teaspoon salt in a
    large bowl. Stir in the melted butter, milk, eggs, maple syrup, and vanilla. Mix
    well and spread evenly in the prepared dish.
- step: Bake until golden and the center is firm, 35 to 45 minutes. Serve warm, drizzled
    with cream or milk if desired. Leftovers will keep refrigerated up to 1 day.
notes:
- 'Tip: Toast raw almonds in a 350°F oven on a rimmed baking sheet until fragrant
  and golden brown, 8 to 10 minutes. Let cool before chopping.'
