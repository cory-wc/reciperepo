description: 'This toum recipe comes from Marjayoun, Lebanon, where Sameer Eid grew
  up eating it with shawarma. Samy, Sameer''s son, learned how to make it after he
  started working at Phoenicia, the family''s restaurant in Birmingham, Mich. The
  key is to be patient during Step 1, to be sure the garlic breaks down enough to
  later become a creamy, fluffy condiment. Toum is called "garlic whip" on Phoenicia''s
  menu. It''s served with roasted chicken and kebabs; some customers even request
  it with babyback ribs. It''s versatile, and also great drizzled over roasted vegetables
  and avocado toast.

  '
yields:
- amount: 4.5
  unit: cup
ingredients:
- peeled garlic cloves:
    amounts:
    - amount: 1
      unit: cup
    notes: about 32 cloves, from 3 to 4 whole heads
- kosher salt:
    amounts:
    - amount: 2.5
      unit: teaspoon
- fresh lemon juice:
    amounts:
    - amount: 0.5
      unit: cup
    notes: from 3 to 4 lemons
- canola oil or grapeseed oil:
    amounts:
    - amount: 3.5
      unit: cup
- ice water:
    amounts:
    - amount: 2
      unit: tablespoon
steps:
- step: 'Place peeled garlic and salt in the bowl of a food processor. Pulse the garlic
    for 30 seconds, scrape down the sides of the bowl, then repeat three more times
    until garlic is finely chopped.

    '
- step: 'Add 2 tablespoons lemon juice and continue processing until a smooth paste
    forms, about 3 minutes, scraping down the sides of the bowl every 45 seconds or
    so. You want the wet, finely chopped garlic mixture to end up with a texture similar
    to mashed potatoes. Pinch it between your fingertips, and it should no longer
    feel gritty. (If you don''t blend the garlic enough at this stage, it won''t become
    fluffy and emulsified later.)

    '
X-total_time: 15 minutes, plus chilling
