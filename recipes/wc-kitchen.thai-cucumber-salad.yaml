steps:
- step: In a small bowl, combine the rice vinegar, sugar, sesame oil, red pepper flakes,
    and salt. Set the dressing aside to give it time to blend.
- step: Peel and slice the cucumber using your favorite method. Place the sliced cucumbers
    in a large bowl.
- step: Chop the peanuts into smaller pieces, if desired. Slice the green onions.
- step: Add the dressing, peanuts, and green onions to the sliced cucumbers. Stir
    to combine. Serve immediately or refrigerate until ready to eat. Give the salad
    a brief stir before serving to redistribute the dressing and flavors.
