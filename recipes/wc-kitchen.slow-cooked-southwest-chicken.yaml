- low-fat

yields:
- amount: 6
  unit: servings

ingredients:
- black beans:
    amounts:
    - amount: 2
      unit: cans (15 oz each)
    processing:
    - rinsed
    - drained
- reduced-sodium chicken broth:
    amounts:
    - amount: 1
      unit: can (14.5 oz)
- diced tomatoes with mild green chiles:
    amounts:
    - amount: 1
      unit: can (14.5 oz)
    notes: undrained
- chicken breast:
    amounts:
    - amount: 0.5
      unit: pounds
    notes: boneless, skinless
- chunky salsa:
    amounts:
    - amount: 1
      unit: jar (8 oz)
- frozen corn:
    amounts:
    - amount: 1
      unit: cups
- dried parsley flakes:
    amounts:
    - amount: 1
      unit: tablespoons
- ground cumin:
    amounts:
    - amount: 1
      unit: teaspoons
- pepper:
    amounts:
    - amount: 0.25
      unit: teaspoons

steps:
- step: In a 2- or 3-qt. slow cooker, combine the beans, broth, tomatoes, chicken,
    salsa, corn and seasonings. Cover and cook on low 3-4 hours or until a thermometer
    inserted in chicken reads 165°F.
- step: Serve over hot cooked rice. Garnish with lime wedges and fresh cilantro leaves
    if desired.

notes:
- Serve over 3 cups hot cooked rice.
- Optional garnishes: lime wedges, fresh cilantro leaves.

